/* === 1. Tokens === */
:root {
  /* (a) primitives: the only raw hexes */
  --grey-0: #ffffff; --grey-50: #f7f7f7; --grey-100: #eeeeec; --grey-150: #e5e4e2; --grey-400: #8f8f8f;
  --slate-50: #eef0f3; --slate-200: #d6dae1; --slate-600: #5b6472; --slate-700: #4a505c; --slate-900: #333641;
  --blue-50: #e7f2ff; --blue-200: #bfe0ff; --blue-500: #1b97ff; --blue-700: #1666bf;
  --green-50: #e9f6ef; --green-200: #b7e0c8; --green-700: #17764c;
  --amber-50: #f7efdd; --amber-200: #e6d3a3; --amber-700: #8a5a00;
  --red-50: #fbe9e4; --red-200: #eab8a7; --red-700: #b22f17;
  --teal-50: #e3f4ef; --teal-200: #bfe6db; --teal-700: #0a6b59;
  --plum-50: #f3e9f5; --plum-200: #ddc3e3; --plum-700: #70357b;

  /* (b) semantics */
  --color-bg: var(--grey-0); --color-surface: var(--grey-50); --color-surface-2: var(--grey-100);
  --color-ink: var(--slate-900); --color-ink-soft: var(--slate-600);
  --color-line: var(--grey-150); --color-line-strong: var(--grey-400);
  --color-accent: var(--blue-500); --color-accent-text: var(--blue-700); --focus-ring: var(--blue-700);
  --color-on-ink: var(--grey-0);
  --status-positive-text: var(--green-700); --status-positive-bg: var(--green-50); --status-positive-border: var(--green-200);
  --status-warning-text: var(--amber-700); --status-warning-bg: var(--amber-50); --status-warning-border: var(--amber-200);
  --status-info-text: var(--blue-700); --status-info-bg: var(--blue-50); --status-info-border: var(--blue-200);
  --status-neutral-text: var(--slate-700); --status-neutral-bg: var(--slate-50); --status-neutral-border: var(--slate-200);
  --status-negative-text: var(--red-700); --status-negative-bg: var(--red-50); --status-negative-border: var(--red-200);
  --cat-2-text: var(--teal-700); --cat-2-bg: var(--teal-50); --cat-2-border: var(--teal-200);
  --cat-4-text: var(--plum-700); --cat-4-bg: var(--plum-50); --cat-4-border: var(--plum-200);

  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Roboto Mono", "Liberation Mono", monospace;
  --fw-regular: 400; --fw-medium: 500; --fw-semibold: 600; --fw-bold: 700; --fw-black: 800;
  --lh-display: 1.1; --lh-heading: 1.2; --lh-body: 1.6; --lh-lead: 1.5; --lh-tight: 1.35;
  --text-kicker: 0.75rem; --text-small: 0.875rem; --text-table: 0.9375rem; --text-body: 1.0625rem;
  --text-lead: 1.1875rem; --text-zh: 1.1875rem; --text-zh-lg: 1.5rem; --text-num: 2rem;
  --text-h3: 1.1875rem; --text-h2: 1.375rem; --text-h1: 2rem;

  --space-3xs: 4px; --space-2xs: 8px; --space-xs: 12px; --space-sm: 16px; --space-md: 24px;
  --space-lg: 32px; --space-xl: 48px; --space-2xl: 64px;
  --radius-sm: 4px; --radius-md: 6px; --radius-lg: 8px;
  --border-width: 1px; --cue-width: 3px; --tap: 44px; --tap-lg: 48px;
  --tabbar: 60px; --measure: 40rem;
  --shadow-card: 0 1px 2px rgb(51 54 65 / .08), 0 8px 32px rgb(51 54 65 / .12);
  --card-bg: var(--color-surface); --card-border: var(--slate-200); --radius-card: var(--radius-lg); /* every box on the page: grey, a hairline border, flat */
  --motion-fast: 120ms; --motion-base: 200ms; --ease-standard: cubic-bezier(.2, 0, 0, 1);
}

/* === 2. Base === */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: var(--space-2xl); scroll-padding-bottom: calc(var(--tabbar) + var(--space-sm)); }
body {
  margin: 0; font-family: var(--font-sans); font-size: var(--text-body); font-weight: var(--fw-regular);
  line-height: var(--lh-body); color: var(--color-ink); background: var(--color-bg);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  padding-bottom: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px));
  overflow-x: hidden;
}
body.locked { overflow: hidden; }
a { color: var(--color-accent-text); text-underline-offset: 2px; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; border-radius: var(--radius-sm); }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { color: var(--color-ink); text-wrap: balance; }
ul, ol { margin: 0; padding: 0; list-style: none; }
.defs { position: absolute; width: 0; height: 0; overflow: hidden; }
.zh, .zh-in { font-family: var(--font-cjk); }
.zh { font-size: var(--text-zh); font-weight: var(--fw-bold); line-height: var(--lh-lead); color: var(--color-ink); }
.mono, time { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.soft { color: var(--color-ink-soft); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.kicker, .label {
  display: block; font-size: var(--text-kicker); font-weight: var(--fw-semibold); line-height: var(--lh-heading);
  letter-spacing: .08em; text-transform: uppercase; color: var(--color-ink-soft);
}
.skip {
  position: absolute; left: var(--space-sm); top: -100px; z-index: 90; padding: var(--space-2xs) var(--space-sm);
  background: var(--color-surface); border: var(--border-width) solid var(--color-line-strong);
  border-radius: var(--radius-sm); font-weight: var(--fw-semibold); text-decoration: none;
}
.skip:focus-visible { top: var(--space-sm); }

/* === 3. Layout: header, main, footer, tab bar === */
.top {
  display: flex; align-items: center; gap: var(--space-xs); padding: var(--space-sm) var(--space-sm) var(--space-xs);
  border-block-end: var(--border-width) solid var(--color-line);
}
.wordmark { display: block; height: 14px; width: auto; color: var(--color-ink); flex: none; }
.top-t { font-size: var(--text-kicker); font-weight: var(--fw-semibold); letter-spacing: .06em; text-transform: uppercase; color: var(--color-ink-soft); line-height: var(--lh-heading); }
main { display: block; max-width: var(--measure); margin: 0 auto; padding: var(--space-md) var(--space-sm) var(--space-lg); min-height: 60vh; }
main:focus { outline: none; }
.foot {
  max-width: var(--measure); margin: 0 auto; padding: var(--space-md) var(--space-sm) var(--space-lg);
  border-block-start: var(--border-width) solid var(--color-line-strong); color: var(--color-ink-soft); font-size: var(--text-small); line-height: var(--lh-lead);
}
.foot p + p { margin-block-start: var(--space-2xs); }
.foot .ver { font-family: var(--font-mono); font-size: var(--text-kicker); }
a.mail { overflow-wrap: anywhere; } /* an address wraps whole at 320 px, and breaks only if it can't fit a line */
.tabs {
  position: fixed; inset: auto 0 0 0; z-index: 30; display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--color-bg); border-block-start: var(--border-width) solid var(--color-line-strong);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabs button {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-height: var(--tabbar); padding: 6px 2px 4px; border: 0; background: none; color: var(--color-ink-soft);
  font-size: var(--text-kicker); font-weight: var(--fw-semibold); letter-spacing: .02em;
}
.tabs svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.tabs button[aria-current] { color: var(--color-ink); font-weight: var(--fw-black); }
.tabs button[aria-current]::before { content: ""; position: absolute; top: -1px; left: 22%; right: 22%; height: var(--cue-width); border-radius: 0 0 var(--radius-sm) var(--radius-sm); background: var(--color-accent); }
.testbar {
  max-width: var(--measure); margin: var(--space-xs) auto 0; padding: var(--space-3xs) var(--space-sm);
  font-size: var(--text-small); color: var(--status-warning-text); background: var(--status-warning-bg);
  border-block: var(--border-width) solid var(--status-warning-border); font-weight: var(--fw-semibold);
}

/* === 4. Typography blocks: page head (masthead), section head === */
.mast { margin-block-end: var(--space-md); }
.mast .kicker { margin-block-end: var(--space-2xs); }
.mast h1 { font-size: var(--text-h1); font-weight: var(--fw-black); line-height: var(--lh-display); letter-spacing: -.01em; }
.mast h1 .accent { color: var(--color-accent); }
.mast .sub { margin-block-start: var(--space-2xs); font-size: var(--text-lead); font-weight: var(--fw-medium); line-height: var(--lh-lead); color: var(--color-ink-soft); }
.mast.lander h1 { font-size: clamp(2rem, 10vw, 2.5rem); letter-spacing: -.02em; }
.mast.lander .sub { margin-block-start: var(--space-xs); line-height: var(--lh-tight); }
.mast.lander .sub b { display: block; font-weight: var(--fw-bold); color: var(--color-ink); }
.mast.lander .sub span { display: block; margin-block-start: var(--space-3xs); font-size: var(--text-body); }
.sechead {
  display: flex; align-items: baseline; gap: var(--space-xs); margin: var(--space-xl) 0 var(--space-sm);
  padding-block-end: var(--space-xs); border-block-end: var(--border-width) solid var(--color-line); scroll-margin-top: var(--space-md);
}
.sechead:first-child { margin-block-start: 0; }
.sechead .n { font-family: var(--font-mono); font-size: var(--text-table); font-weight: var(--fw-bold); color: var(--color-accent-text); font-variant-numeric: tabular-nums; }
.sechead h2 { font-size: var(--text-h2); font-weight: var(--fw-black); line-height: var(--lh-heading); }
.sechead .aside { margin-inline-start: auto; font-size: var(--text-small); color: var(--color-ink-soft); white-space: nowrap; }
h3.h3 { font-size: var(--text-h3); font-weight: var(--fw-bold); line-height: var(--lh-heading); margin: var(--space-md) 0 var(--space-xs); }
.lede { color: var(--color-ink-soft); margin-block-end: var(--space-sm); }
.fine { font-size: var(--text-small); color: var(--color-ink-soft); margin-block: var(--space-xs); }
.prose p { margin-block-end: var(--space-xs); }
.prose ul { margin: 0 0 var(--space-sm); }
.prose ul > li { position: relative; padding: var(--space-3xs) 0 var(--space-3xs) var(--space-md); }
.prose ul > li::before { content: "\2014"; position: absolute; left: 0; color: var(--color-ink-soft); }

/* === 5. Components === */
/* state badge: colour plus a text label */
.state {
  display: inline-flex; align-items: center; gap: var(--space-3xs); min-height: 24px; padding: 1px var(--space-2xs);
  border-radius: var(--radius-sm); border: var(--border-width) solid; font-size: .8125rem; font-weight: var(--fw-semibold);
  line-height: var(--lh-tight); white-space: nowrap; vertical-align: middle;
}
.state::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.state.is-info { color: var(--status-info-text); background: var(--status-info-bg); border-color: var(--status-info-border); }
.state.is-positive { color: var(--status-positive-text); background: var(--status-positive-bg); border-color: var(--status-positive-border); }
.state.is-warning { color: var(--status-warning-text); background: var(--status-warning-bg); border-color: var(--status-warning-border); }
.state.is-neutral { color: var(--status-neutral-text); background: var(--status-neutral-bg); border-color: var(--status-neutral-border); }
.state.is-negative { color: var(--status-negative-text); background: var(--status-negative-bg); border-color: var(--status-negative-border); }
.state.is-cat2 { color: var(--cat-2-text); background: var(--cat-2-bg); border-color: var(--cat-2-border); }
.state.is-cat4 { color: var(--cat-4-text); background: var(--cat-4-bg); border-color: var(--cat-4-border); }
.tags { display: flex; flex-wrap: wrap; gap: var(--space-3xs); margin-block-start: var(--space-3xs); }

/* showcard: the one thing on screen that matters most (current talk, registration, a person to meet).
   Grey, a hairline border, flat, and a short blue marker (--hl) on the left edge beside the label, clear of the
   corners; a clash is red. What is on now says so in its label, with a dot, so the state is never colour alone. */
.showcard {
  position: relative; padding: var(--space-sm); background: var(--card-bg);
  border: var(--border-width) solid var(--card-border); border-radius: var(--radius-card);
  margin-block-end: var(--space-sm); --hl: var(--color-accent);
}
.showcard::before, .s-head:not(.plain)::before, .tcard.key::before, .tablecard.is-now .tr.today::before {
  content: ""; position: absolute; top: var(--hl-top, 14px); inset-inline-start: var(--hl-x, calc(-1 * var(--border-width)));
  width: 4px; height: var(--hl-h, 18px); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; background: var(--hl, var(--color-accent));
}
.showcard.reg { --hl-top: 20px; } /* its label sits on the place's baseline */
.tomeet .showcard { --hl-top: 22px; --hl-h: 20px; } /* beside the name */
.showcard .label { margin-block-end: var(--space-3xs); }
.showcard.is-clash { --hl: var(--status-negative-text); }
.showcard.is-now > .label, .showcard.is-clash > .label { display: flex; align-items: center; gap: var(--space-2xs); color: var(--status-info-text); }
.showcard.is-clash > .label { color: var(--status-negative-text); }
.showcard.is-now > .label::before, .showcard.is-clash > .label::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 3px var(--status-info-border); }
.showcard.is-clash > .label::before { box-shadow: 0 0 0 3px var(--status-negative-border); }
.showcard.is-clash .opt { border-block-start-color: var(--status-negative-border); }
/* a card head: label on the left, the place on the right */
.sc-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 0 var(--space-xs); margin-block-end: var(--space-2xs); }
.sc-h .label { margin: 0; }
.sc-h .where { font-size: var(--text-table); }
/* registration: one row per day, the hours in mono, the note under them */
.reg-days li { display: grid; grid-template-columns: 5.75rem minmax(0, 1fr); gap: 0 var(--space-xs); align-items: baseline; padding-block: var(--space-2xs); border-block-start: var(--border-width) solid var(--color-line); line-height: var(--lh-tight); }
.reg-days li:first-child { border-block-start: 0; padding-block-start: var(--space-3xs); }
.reg-days li:last-child { padding-block-end: 0; }
.reg-days .rd { font-weight: var(--fw-semibold); }
.reg-days .rt b { font-weight: var(--fw-bold); }
.reg-days .rt .state { margin-inline-start: var(--space-3xs); }
.reg-days small { display: block; margin-block-start: 2px; font-size: var(--text-small); color: var(--color-ink-soft); }
.card-t { font-size: var(--text-lead); font-weight: var(--fw-bold); line-height: var(--lh-heading); margin-block: var(--space-3xs) var(--space-2xs); }
.card-who { font-weight: var(--fw-semibold); }
.card-aff, .card-meta { color: var(--color-ink-soft); font-size: var(--text-table); line-height: var(--lh-lead); }
.card-meta { margin-block-start: var(--space-2xs); }
.where { font-weight: var(--fw-bold); color: var(--color-ink); }
.where .fl { font-family: var(--font-mono); font-weight: var(--fw-bold); }

/* buttons and links that look like buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2xs); min-height: var(--tap);
  padding: var(--space-2xs) var(--space-sm); border: var(--border-width) solid var(--color-line-strong);
  border-radius: var(--radius-md); background: var(--color-bg); color: var(--color-ink); font-size: var(--text-table);
  font-weight: var(--fw-semibold); text-decoration: none; line-height: var(--lh-tight);
}
.btn.primary { background: var(--color-ink); border-color: var(--color-ink); color: var(--color-on-ink); }
.btn:disabled, .btn.primary:disabled { background: var(--color-surface-2); border-color: var(--color-line); color: var(--color-ink-soft); cursor: default; } /* Show big with nothing typed */
.btn[aria-pressed="true"] { background: var(--color-ink); border-color: var(--color-ink); color: var(--color-on-ink); }
.btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.btns { display: flex; flex-wrap: wrap; gap: var(--space-2xs); margin-block-start: var(--space-xs); }
.links { display: flex; flex-wrap: wrap; gap: var(--space-2xs) var(--space-sm); margin-block-start: var(--space-2xs); font-size: var(--text-table); }
.links a { display: inline-flex; align-items: center; min-height: var(--tap); font-weight: var(--fw-semibold); }
.more { display: inline-flex; align-items: center; min-height: var(--tap); font-weight: var(--fw-semibold); }

/* star toggle */
.star {
  flex: none; width: var(--tap-lg); height: var(--tap-lg); display: inline-flex; align-items: center; justify-content: center;
  border: 0; background: none; padding: 0; border-radius: var(--radius-md); color: var(--color-ink-soft);
}
.star svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round; }
.star[aria-pressed="true"] { color: var(--color-ink); }
.star[aria-pressed="true"] svg { fill: var(--color-accent); stroke: var(--color-ink); }
.btn.star-btn, .btn.meet { min-height: var(--tap-lg); } /* star and to-meet are 48 px, the wide ones too */
.btn.star-btn[aria-pressed="true"] svg { fill: var(--color-accent); stroke: var(--color-on-ink); }

/* talk rows */
.tlist > li { border-block-start: var(--border-width) solid var(--color-line); }
.tlist > li:first-child { border-block-start: 0; }
.trow { display: grid; grid-template-columns: 3.4rem minmax(0, 1fr) var(--tap-lg); gap: 0 var(--space-xs); align-items: start; padding: var(--space-xs) 0; }
.trow .tm { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: var(--text-table); font-weight: var(--fw-bold); color: var(--color-ink); padding-block-start: 2px; }
.trow .tm small { display: block; font-weight: var(--fw-regular); color: var(--color-ink-soft); font-size: var(--text-kicker); }
.trow .go { display: block; min-width: 0; text-decoration: none; color: inherit; border: 0; background: none; padding: 0; text-align: start; }
.trow .ti { display: block; font-weight: var(--fw-semibold); line-height: var(--lh-tight); }
.trow .nm { display: block; margin-block-start: 2px; font-size: var(--text-table); color: var(--color-ink-soft); line-height: var(--lh-tight); }
.trow .nm b { color: var(--color-ink); font-weight: var(--fw-semibold); }
.trow.is-star .ti::before { content: ""; }
.trow.is-now { background: var(--status-info-bg); margin-inline: calc(-1 * var(--space-2xs)); padding-inline: var(--space-2xs); border-radius: var(--radius-sm); }
.trow.is-past .ti, .trow.is-past .tm { color: var(--color-ink-soft); }
.erow { display: grid; grid-template-columns: 3.4rem 1fr; gap: 0 var(--space-xs); padding: var(--space-2xs) 0; color: var(--color-ink-soft); font-size: var(--text-table); }
.erow .tm { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: var(--fw-bold); }
.erow.is-break { background: var(--color-surface); margin-inline: calc(-1 * var(--space-2xs)); padding-inline: var(--space-2xs); border-radius: var(--radius-sm); }
.erow .sub { display: block; }
.erow.is-now { color: var(--color-ink); }
/* the timeline's "you are here" between two rows: the clock time and a blue rule */
.nowline { display: grid; grid-template-columns: 3.4rem 1fr; gap: 0 var(--space-xs); align-items: center; min-height: 28px; scroll-margin-block: var(--space-2xl); }
.tlist > li.nowline, .tlist > li.nowline + li { border-block-start: 0; }
.nowline .tm { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: var(--text-small); font-weight: var(--fw-bold); color: var(--status-info-text); }
.nowline .nl { display: flex; align-items: center; gap: var(--space-2xs); font-size: var(--text-small); font-weight: var(--fw-bold); color: var(--status-info-text); }
.nowline .nl::after { content: ""; flex: 1; height: 2px; border-radius: 1px; background: var(--color-accent); }

/* a session and My schedule as a timeline: time · a rail with one dot per row · the row. The dot says where the row
   stands: done (small, grey, starred or not), now (blue with a halo, the row tinted and saying Now), later (an open
   ring), later and starred (filled blue, as on Now). The Now line between two rows puts its dot on the rail. The
   gutter is the grid gap plus the row's own 16 px, the rail in its middle. */
.tl { --tl-x: calc(3.4rem + (var(--space-xs) + var(--space-sm)) / 2); --dy: 26px; }
.tl > li { position: relative; }
.tlist.tl > li { border-block-start: 0; }
.tl > li.erow { --dy: 20px; }
.tl > li.nowline { --dy: 50%; }
.tl > li::before { content: ""; position: absolute; inset-block: 0; inset-inline-start: calc(var(--tl-x) - 1px); width: 2px; background: var(--color-line); }
.tl > li:first-child::before { inset-block-start: var(--dy); }
.tl > li:last-child::before { inset-block-end: auto; height: var(--dy); }
.tl > li:only-child::before { display: none; }
.tl > li::after {
  content: ""; position: absolute; z-index: 1; top: calc(var(--dy) - 5px); inset-inline-start: calc(var(--tl-x) - 5px);
  width: 10px; height: 10px; border-radius: 50%; background: var(--color-bg); border: 2px solid var(--color-line-strong);
}
.tl > li.t-star::after { background: var(--color-accent); border-color: var(--color-accent); }
.tl > li.t-past::after, .tl > li.erow.is-past::after { top: calc(var(--dy) - 4px); inset-inline-start: calc(var(--tl-x) - 4px); width: 8px; height: 8px; border: 0; background: var(--color-line-strong); }
.tl > li.t-now::after, .tl > li.erow.is-now::after, .tl > li.nowline::after {
  top: calc(var(--dy) - 6px); inset-inline-start: calc(var(--tl-x) - 6px); width: 12px; height: 12px; border: 0;
  background: var(--color-accent); box-shadow: 0 0 0 4px var(--status-info-border);
}
.tl > li.erow.is-break, .tl > li.erow.is-now { --tl-x: calc(3.4rem + (var(--space-xs) + var(--space-sm)) / 2 + var(--space-2xs)); } /* the band starts 8 px further left */
.tl .trow .go, .tl .erow > span + span, .tl .nowline .nl { padding-inline-start: var(--space-sm); }
.tl .trow.is-star { box-shadow: none; } /* the dot says starred here */
.tl .trow.is-now, .tl .erow.is-now { border-radius: var(--radius-md); }
.tl .erow.is-now { background: var(--status-info-bg); margin-inline: calc(-1 * var(--space-2xs)); padding-inline: var(--space-2xs); }
.tl .erow.is-now .tm, .tl .trow.is-now .tm { color: var(--status-info-text); }
.tl > li.po::before, .tl > li.po::after { display: none; } /* the fold keeps its full width and teal edge; the rail stops at the pitch */
.tl > li:has(+ li.po:last-child)::before { inset-block-end: auto; height: var(--dy); }
.tl > li:first-child:has(+ li.po:last-child)::before { display: none; }
.s-meta .zh-in { white-space: nowrap; }

/* sessions (programme) */
.session { margin-block-end: var(--space-lg); scroll-margin-top: var(--space-md); }
.s-head { position: relative; padding: var(--space-xs) var(--space-sm); background: var(--card-bg); border: var(--border-width) solid var(--card-border); border-radius: var(--radius-card); margin-block-end: var(--space-xs); --hl-top: 13px; --hl-h: 22px; }
.s-name { font-size: var(--text-h3); font-weight: var(--fw-bold); line-height: var(--lh-heading); }
.s-name .num { display: inline-block; padding: 0 5px; margin-inline-end: 6px; border-radius: var(--radius-sm); background: var(--status-info-bg); font-family: var(--font-mono); font-size: var(--text-table); line-height: var(--lh-tight); color: var(--color-accent-text); vertical-align: 1px; }
.s-meta { font-size: var(--text-table); color: var(--color-ink-soft); margin-block-start: var(--space-3xs); line-height: var(--lh-lead); }
.s-meta a { font-weight: var(--fw-semibold); }
.s-note { font-size: var(--text-small); color: var(--status-warning-text); margin-block-start: var(--space-3xs); }
.posters { margin: var(--space-2xs) 0 var(--space-2xs) 3.9rem; border-inline-start: var(--cue-width) solid var(--cat-2-border); padding-inline-start: var(--space-xs); }
.posters > summary { min-height: var(--tap); display: flex; align-items: center; font-weight: var(--fw-semibold); color: var(--cat-2-text); cursor: pointer; }
.posters .trow { grid-template-columns: 2rem minmax(0, 1fr) var(--tap-lg); }
.part-h { margin: var(--space-md) 0 var(--space-xs); font-size: var(--text-kicker); font-weight: var(--fw-semibold); letter-spacing: .08em; text-transform: uppercase; color: var(--color-ink-soft); display: flex; align-items: center; gap: var(--space-xs); }
.part-h::after { content: ""; flex: 1; height: var(--border-width); background: var(--color-line); }
.day-h { font-size: var(--text-h2); font-weight: var(--fw-black); margin: var(--space-xl) 0 var(--space-xs); scroll-margin-top: var(--space-2xl); }
.day-h:first-child { margin-block-start: var(--space-sm); }
.pre { margin-block-end: var(--space-lg); background: var(--card-bg); border: var(--border-width) solid var(--card-border); border-radius: var(--radius-card); }
.pre > summary { min-height: var(--tap); display: flex; align-items: center; padding: var(--space-xs) var(--space-sm); font-weight: var(--fw-bold); cursor: pointer; }
.pre > div { padding: 0 var(--space-sm) var(--space-sm); }

/* filters */
.filters { margin-block-end: var(--space-sm); padding-block-end: var(--space-xs); border-block-end: var(--border-width) solid var(--color-line); }
.seg { display: flex; flex-wrap: wrap; gap: var(--space-3xs); padding-block: var(--space-3xs); margin-block-end: var(--space-3xs); }
.seg::-webkit-scrollbar { display: none; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: var(--space-3xs); min-height: 40px; padding: var(--space-3xs) var(--space-xs);
  border-radius: var(--radius-sm); border: var(--border-width) solid transparent; background: var(--color-surface-2);
  color: var(--color-ink); font-size: var(--text-small); font-weight: var(--fw-medium); white-space: nowrap; line-height: var(--lh-tight);
}
.chip small { font-family: var(--font-mono); font-size: var(--text-kicker); color: var(--color-ink-soft); }
.chip[aria-pressed="true"] { background: var(--color-ink); color: var(--color-on-ink); font-weight: var(--fw-bold); }
.chip[aria-pressed="true"] small { color: var(--slate-200); }
.chip.is-clash { border-color: var(--status-negative-border); background: var(--status-negative-bg); color: var(--status-negative-text); }
.row2 { display: flex; gap: var(--space-2xs); align-items: center; }
.search {
  flex: 1; min-width: 0; min-height: var(--tap); padding: var(--space-2xs) var(--space-xs); border: var(--border-width) solid var(--color-line-strong);
  border-radius: var(--radius-md); background: var(--color-bg); font-size: var(--text-body);
}
.search::placeholder { color: var(--color-ink-soft); }
.count { font-size: var(--text-small); color: var(--color-ink-soft); margin-block: var(--space-2xs) var(--space-sm); }

/* day grid: rooms x parts of day */
.grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); background: var(--card-bg); border: var(--border-width) solid var(--card-border); border-radius: var(--radius-card); overflow: hidden; margin-block-end: var(--space-md); font-size: var(--text-small); }
.grid.g2 { grid-template-columns: 6.4rem minmax(0, 1fr) minmax(0, 1fr); }
.grid.g2 .gr { display: block; white-space: normal; padding-block: var(--space-3xs); line-height: var(--lh-tight); }
.grid.g2 .gr small { display: block; margin: 0; }
.grid > * { padding: 0 var(--space-2xs); border-block-start: var(--border-width) solid var(--color-line); border-inline-start: var(--border-width) solid var(--color-line); min-width: 0; }
.grid > .gr, .grid > .gh:first-child { border-inline-start: 0; }
.grid > .gh { border-block-start: 0; }
.grid .gh { background: var(--color-surface-2); font-size: var(--text-kicker); font-weight: var(--fw-semibold); letter-spacing: .06em; text-transform: uppercase; color: var(--color-ink-soft); }
.grid .gr { background: var(--color-surface); font-weight: var(--fw-semibold); line-height: var(--lh-tight); }
.grid .gr { display: flex; align-items: center; min-height: var(--tap); white-space: nowrap; }
.grid .gh { padding-block: var(--space-3xs); }
.grid .gcell { display: flex; align-items: center; flex-wrap: wrap; column-gap: var(--space-3xs); overflow-wrap: anywhere; }
.grid .gcell small { flex-basis: 100%; }
.grid .gr small { font-family: var(--font-mono); color: var(--color-ink); font-weight: var(--fw-bold); margin-inline-start: var(--space-3xs); }
.grid .gh .mono { letter-spacing: 0; }
.grid a { display: block; color: var(--color-ink); text-decoration: none; line-height: var(--lh-tight); min-height: 36px; }
.grid a b { font-family: var(--font-mono); color: var(--color-accent-text); }
.grid .empty { color: var(--color-ink-soft); }

/* rooms now and next (Now): a departure board, one line per talk */
.rooms > li { padding: var(--space-xs) 0 var(--space-2xs); border-block-start: var(--border-width) solid var(--color-line); }
.rooms > li:first-child { border-block-start: 0; padding-block-start: 0; }
.rooms .rh { display: flex; align-items: baseline; gap: var(--space-3xs); font-size: var(--text-table); line-height: var(--lh-tight); margin-block-end: 2px; }
.rooms .rh b { font-weight: var(--fw-bold); }
.rooms .rh .fl { font-family: var(--font-mono); font-weight: var(--fw-bold); }
.rooms .rh .zh { margin-inline-start: auto; font-size: var(--text-small); font-weight: var(--fw-regular); color: var(--color-ink-soft); line-height: var(--lh-tight); }
.rooms .slot { display: grid; grid-template-columns: 3.2rem minmax(0, 1fr); gap: 0 var(--space-2xs); align-items: baseline; min-height: var(--tap); padding-block: 2px; text-decoration: none; color: inherit; }
.rooms .when { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: var(--text-table); font-weight: var(--fw-bold); color: var(--color-ink); }
.rooms .st, .rooms .sn { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: var(--lh-tight); }
.rooms .st { font-weight: var(--fw-semibold); color: var(--color-ink); }
.rooms .sn { font-size: var(--text-small); color: var(--color-ink-soft); }

/* my next starred talk: the clock time is the big text */
.next { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--space-sm); align-items: start; padding: var(--space-sm); background: var(--card-bg); border: var(--border-width) solid var(--card-border); border-radius: var(--radius-card); margin-block-end: var(--space-sm); text-decoration: none; color: inherit; }
.nx-tm { display: flex; flex-direction: column; min-width: 4.4rem; font-family: var(--font-mono); font-variant-numeric: tabular-nums; line-height: var(--lh-tight); }
.nx-tm b { font-size: 1.625rem; font-weight: var(--fw-bold); line-height: var(--lh-display); color: var(--color-ink); }
.nx-tm small { font-family: var(--font-sans); font-size: var(--text-small); font-weight: var(--fw-semibold); color: var(--color-ink-soft); }
.next .nt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-block: var(--space-3xs) 2px; font-weight: var(--fw-bold); line-height: var(--lh-tight); color: var(--color-ink); }
.nx-w { display: block; font-size: var(--text-table); line-height: var(--lh-lead); }
.nx-c .where { white-space: nowrap; }
.nx-c { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-block-start: var(--space-2xs); font-size: var(--text-table); line-height: var(--lh-lead); color: var(--color-ink); }
.next .sn { display: block; font-size: var(--text-small); color: var(--color-ink-soft); line-height: var(--lh-tight); }

/* hero numbers (countdown before the conference): "1 day 19 h" reads as one line, numbers big and blue, units beside them */
.big-n { margin-block: var(--space-md); }
.big-n .cd { display: flex; flex-wrap: wrap; align-items: baseline; line-height: 1; }
.big-n .cd b { font-size: 4rem; font-weight: var(--fw-black); line-height: 1; color: var(--color-accent); font-variant-numeric: tabular-nums; letter-spacing: -.03em; }
.big-n .cd span { margin-inline: var(--space-3xs) var(--space-sm); font-size: var(--text-h2); font-weight: var(--fw-bold); color: var(--color-ink); }
.big-n .cd span:last-child { margin-inline-end: 0; }
.big-n .cd-t { margin-block-start: var(--space-xs); font-size: var(--text-lead); font-weight: var(--fw-bold); line-height: var(--lh-heading); color: var(--color-ink); }
.big-n .cd-w { margin-block-start: var(--space-3xs); font-size: var(--text-table); line-height: var(--lh-lead); color: var(--color-ink-soft); }
.big-n .cd-w b { color: var(--color-ink); }
.big-n .cd-w .where { font-weight: var(--fw-semibold); color: var(--color-ink-soft); white-space: nowrap; }

/* timeline of the day (Later today, Earlier today, Tomorrow): a rail with a dot per item (filled = starred); the whole row is the target */
.agenda > li { position: relative; }
.agenda > li::before { content: ""; position: absolute; inset-block: 0; inset-inline-start: calc(4.2rem + var(--space-sm) / 2 - 1px); width: 2px; background: var(--color-line); }
.agenda > li:first-child::before { inset-block-start: calc(var(--space-xs) + .6em); }
.agenda > li:last-child::before { inset-block-end: auto; height: calc(var(--space-xs) + .6em); }
.agenda > li:only-child::before { display: none; }
.agenda > li::after { content: ""; position: absolute; inset-block-start: calc(var(--space-xs) + .6em - 5px); inset-inline-start: calc(4.2rem + var(--space-sm) / 2 - 5px); width: 10px; height: 10px; border-radius: 50%; background: var(--color-bg); border: 2px solid var(--color-line-strong); }
.agenda > li.is-star::after { background: var(--color-accent); border-color: var(--color-accent); }
.agenda > li.t-past::after { inset-block-start: calc(var(--space-xs) + .6em - 4px); inset-inline-start: calc(4.2rem + var(--space-sm) / 2 - 4px); width: 8px; height: 8px; border: 0; background: var(--color-line-strong); }
.agenda .ag-row { display: grid; grid-template-columns: 4.2rem minmax(0, 1fr); gap: 0 var(--space-sm); min-height: var(--tap); padding: var(--space-xs) 0; text-decoration: none; color: inherit; }
.agenda .ag-b { padding-inline-start: var(--space-xs); }
.agenda .tm { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: var(--text-table); font-weight: var(--fw-bold); }
.agenda .tm small { display: block; font-weight: var(--fw-regular); color: var(--color-ink-soft); font-size: var(--text-kicker); }
.agenda .ag-b b { font-weight: var(--fw-semibold); }
.agenda .is-star .ag-b b { font-weight: var(--fw-bold); }
a.ag-row .ag-b > b { text-decoration: underline; text-decoration-color: var(--color-line-strong); text-underline-offset: 2px; }
.agenda .wh { display: block; font-size: var(--text-table); color: var(--color-ink-soft); }
.agenda .ag-n { display: block; font-size: var(--text-small); color: var(--color-ink-soft); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.agenda .ag-n b { color: var(--color-ink); font-weight: var(--fw-semibold); }
.agenda .ag-n.add { color: var(--color-accent-text); font-weight: var(--fw-semibold); }
.trow .rn-note { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; margin-block-start: 2px; font-size: var(--text-small); color: var(--color-ink-soft); line-height: var(--lh-tight); }
.trow .rn-note b { color: var(--color-ink); font-weight: var(--fw-semibold); }
.earlier > summary { margin-block-start: var(--space-sm); }

/* tablecard (at a glance), stacked on phones */
.tablecard { margin-block: var(--space-sm); background: var(--card-bg); border: var(--border-width) solid var(--card-border); border-radius: var(--radius-card); overflow: hidden; }
.tablecard .tr { padding: var(--space-xs) var(--space-sm); border-block-start: var(--border-width) solid var(--color-line); }
.tablecard .tr:first-child { border-block-start: 0; }
.tablecard .th { font-weight: var(--fw-bold); }
.tablecard .td { font-size: var(--text-table); margin-block-start: var(--space-3xs); }
.tablecard .td.wh { color: var(--color-ink-soft); }
.tablecard.is-now .tr.today { position: relative; --hl-x: 0; --hl-top: 17px; } /* today: the marker beside the day, as on the cards */

/* facts (key/value) */
.facts { display: grid; grid-template-columns: 7.5rem 1fr; gap: 0 var(--space-sm); font-size: var(--text-table); margin-block: var(--space-sm); }
.facts dt { font-weight: var(--fw-bold); padding-block: var(--space-2xs); border-block-start: var(--border-width) solid var(--color-line); }
.facts dd { margin: 0; padding-block: var(--space-2xs); border-block-start: var(--border-width) solid var(--color-line); }
.facts dt:first-of-type, .facts dt:first-of-type + dd { border-block-start: 0; }

/* steps: numbered route */
.prose ol, ol.steps { counter-reset: step; margin: 0 0 var(--space-sm); }
.prose ol > li, ol.steps > li { position: relative; counter-increment: step; padding: var(--space-xs) 0 var(--space-xs) var(--space-xl); border-block-end: var(--border-width) solid var(--color-line); }
.prose ol > li:last-child, ol.steps > li:last-child { border-block-end: 0; }
.prose ol > li::before, ol.steps > li::before {
  content: counter(step); position: absolute; left: 0; top: var(--space-xs); display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; border-radius: 50%; background: var(--status-info-bg); color: var(--status-info-text);
  font-family: var(--font-mono); font-size: var(--text-small); font-weight: var(--fw-bold);
}

/* sos tiles */
.sos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-2xs); margin: var(--space-sm) 0; }
.sos a { display: block; padding: var(--space-xs); text-decoration: none; text-align: center; background: var(--status-negative-bg); border: var(--border-width) solid var(--status-negative-border); border-radius: var(--radius-md); }
.sos .num { display: block; font-family: var(--font-mono); font-size: var(--text-num); font-weight: var(--fw-bold); line-height: var(--lh-display); color: var(--status-negative-text); }
.sos .what { display: block; margin-block-start: var(--space-3xs); color: var(--color-ink); font-weight: var(--fw-semibold); font-size: var(--text-small); }

/* jump chips */
.jump { display: flex; flex-wrap: wrap; gap: var(--space-2xs); margin-block-end: var(--space-md); }
.jump a, .jump button {
  display: inline-flex; align-items: baseline; gap: var(--space-2xs); min-height: 40px; padding: var(--space-2xs) var(--space-xs);
  border-radius: var(--radius-sm); background: var(--color-surface-2); color: var(--color-ink); text-decoration: none; border: 0;
  font-size: var(--text-small); font-weight: var(--fw-medium);
}
.jump .num { font-family: var(--font-mono); font-size: var(--text-kicker); color: var(--color-accent-text); }

/* contacts */
.contacts { display: grid; gap: var(--space-2xs); margin: var(--space-sm) 0; }
.contacts li { padding: var(--space-xs) var(--space-sm); background: var(--card-bg); border: var(--border-width) solid var(--card-border); border-radius: var(--radius-card); font-size: var(--text-table); }
.contacts a { display: inline-flex; align-items: center; min-height: 32px; font-weight: var(--fw-semibold); word-break: break-all; }

/* taxi and phrase cards (tap to show full screen) */
.tcard {
  display: block; width: 100%; text-align: start; padding: var(--space-sm); margin-block-end: var(--space-2xs);
  background: var(--card-bg); border: var(--border-width) solid var(--card-border); border-radius: var(--radius-card); color: inherit;
}
.tcard.key { position: relative; padding-block: var(--space-md); --hl-top: 22px; }
.tcard .label { margin-block-end: var(--space-3xs); }
.tcard .zh { display: block; font-size: var(--text-zh); }
.tcard.key .zh { font-size: var(--text-zh-lg); line-height: var(--lh-heading); }
.tcard .zh + .zh { margin-block-start: 2px; }
.tcard .en { display: block; margin-block-start: var(--space-3xs); font-size: var(--text-table); color: var(--color-ink-soft); }
.tcard .py { display: block; font-size: var(--text-small); color: var(--color-ink-soft); }
.pgroups > details { border-block-start: var(--border-width) solid var(--color-line); }
.pgroups > details > summary { min-height: var(--tap); display: flex; align-items: center; justify-content: space-between; font-weight: var(--fw-bold); font-size: var(--text-h3); padding-block: var(--space-xs); cursor: pointer; }
.pgroups > details > summary small { font-family: var(--font-mono); font-size: var(--text-small); color: var(--color-ink-soft); font-weight: var(--fw-regular); }

/* tools */
.tool { padding: var(--space-sm); background: var(--card-bg); border: var(--border-width) solid var(--card-border); border-radius: var(--radius-card); margin-block-end: var(--space-sm); }
.tool h3 { font-size: var(--text-h3); font-weight: var(--fw-bold); margin-block-end: var(--space-2xs); }
.field { display: block; margin-block-end: var(--space-xs); }
.field > span:first-child { display: block; font-size: var(--text-kicker); font-weight: var(--fw-semibold); letter-spacing: .06em; text-transform: uppercase; color: var(--color-ink-soft); margin-block-end: var(--space-3xs); }
.input, textarea.note {
  display: block; width: 100%; min-height: var(--tap); padding: var(--space-2xs) var(--space-xs); border: var(--border-width) solid var(--color-line-strong);
  border-radius: var(--radius-md); background: var(--color-bg); font-size: var(--text-body); line-height: var(--lh-lead);
}
.input.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: var(--text-lead); }
textarea.note { min-height: 96px; resize: vertical; }
textarea.big-in { min-height: 120px; }
.fx { display: grid; grid-template-columns: 1fr auto 1fr; gap: var(--space-2xs); align-items: end; }
.fx .eq { padding-block-end: 10px; color: var(--color-ink-soft); font-weight: var(--fw-bold); }
.rfind > li { border-block-start: var(--border-width) solid var(--color-line); }
.rfind > li:first-child { border-block-start: 0; }
.rfind button { display: grid; grid-template-columns: 1fr auto; gap: 0 var(--space-xs); align-items: center; width: 100%; padding: var(--space-xs) 0; border: 0; background: none; text-align: start; min-height: var(--tap); }
.rfind .rn { font-weight: var(--fw-bold); }
.rfind .rz { font-family: var(--font-cjk); font-weight: var(--fw-bold); font-size: var(--text-zh); }
.rfind .rw { grid-column: 1 / -1; font-size: var(--text-small); color: var(--color-ink-soft); }
.plan { font-size: var(--text-small); color: var(--color-ink-soft); margin-block: var(--space-2xs) var(--space-xs); }

/* people */
.az { display: flex; flex-wrap: wrap; gap: 2px; margin-block: var(--space-2xs) var(--space-sm); }
.az button { display: inline-flex; align-items: center; justify-content: center; min-width: 30px; min-height: 36px; border-radius: var(--radius-sm); background: var(--color-surface-2); color: var(--color-ink); text-decoration: none; font-weight: var(--fw-semibold); font-size: var(--text-small); }
.letter { font-family: var(--font-mono); font-weight: var(--fw-bold); color: var(--color-accent-text); font-size: var(--text-table); padding: var(--space-sm) 0 var(--space-3xs); border-block-end: var(--border-width) solid var(--color-line); scroll-margin-top: var(--space-2xl); }
.plist > li { border-block-start: var(--border-width) solid var(--color-line); }
.plist > li:first-child { border-block-start: 0; }
.prow { display: grid; grid-template-columns: minmax(0, 1fr) var(--tap-lg); gap: var(--space-xs); align-items: center; padding: var(--space-2xs) 0; }
.prow .go { display: block; min-width: 0; text-decoration: none; color: inherit; border: 0; background: none; padding: var(--space-3xs) 0; text-align: start; }
.prow .pn { display: block; font-weight: var(--fw-semibold); line-height: var(--lh-tight); }
.prow .pa { display: block; font-size: var(--text-small); color: var(--color-ink-soft); line-height: var(--lh-tight); }
.prow .roles { display: block; font-size: var(--text-small); color: var(--color-ink-soft); line-height: var(--lh-tight); margin-block-start: 2px; }
.catch { margin-block-start: var(--space-3xs); font-size: var(--text-table); line-height: var(--lh-lead); }
.search[data-pq] { margin-block-end: var(--space-xs); }
.meet svg { fill: none; }
.tomeet { margin-block-end: var(--space-lg); }
.tomeet .showcard { margin-block-end: var(--space-2xs); }
.orgs li { padding: var(--space-xs) 0; border-block-start: var(--border-width) solid var(--color-line); }
.orgs li:first-child { border-block-start: 0; }

/* sheets (talk, person): full-height overlay with its own scroll */

.x svg { width: 22px; height: 22px; fill: none; stroke: var(--color-ink); stroke-width: 2; stroke-linecap: round; }
.sheet-body { max-width: var(--measure); margin: 0 auto; padding: var(--space-md) var(--space-sm) var(--space-2xl); }

/* full screen show-this card: screen kept on */
.full { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; padding-block-start: 56px; background: var(--color-surface); overflow-y: auto; }
.full .x { position: absolute; top: var(--space-2xs); right: var(--space-2xs); }
.f-card { margin: auto var(--space-sm) var(--space-sm); flex: none; padding: var(--space-md) var(--space-md) var(--space-lg); background: var(--color-bg); border: var(--border-width) solid var(--color-line-strong); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); }
.f-ask { font-family: var(--font-cjk); font-weight: var(--fw-bold); font-size: var(--text-zh); color: var(--color-ink-soft); margin-block-end: var(--space-xs); }

.f-a { font-family: var(--font-cjk); font-weight: var(--fw-bold); font-size: clamp(1.375rem, 6.5vw, 2rem); line-height: 1.35; margin-block-start: var(--space-sm); }

.f-text.cjk { font-family: var(--font-cjk); }
.f-p a { display: inline-flex; align-items: center; min-height: var(--tap); font-family: var(--font-mono); font-size: var(--text-lead); font-weight: var(--fw-bold); }
.f-n { font-size: var(--text-table); color: var(--color-ink-soft); margin-block-start: var(--space-xs); }
.full::after { content: ""; flex: none; margin-block-start: auto; }
.f-awake { margin: 0 var(--space-sm); padding-block-end: var(--space-md); font-size: var(--text-small); color: var(--color-ink-soft); text-align: center; }

/* notes export */
.export pre { white-space: pre-wrap; word-break: break-word; font-family: var(--font-mono); font-size: var(--text-small); background: var(--card-bg); border: var(--border-width) solid var(--card-border); border-radius: var(--radius-card); padding: var(--space-xs); max-height: 16rem; overflow: auto; margin-block-start: var(--space-xs); }

.callout::before { content: ""; position: absolute; inset-block: var(--space-3xs); inset-inline-start: calc(-1 * var(--space-xs)); width: var(--cue-width); border-radius: var(--radius-sm); background: var(--cue); }

.empty-note { padding: var(--space-sm); background: var(--card-bg); border: var(--border-width) solid var(--card-border); border-radius: var(--radius-card); color: var(--color-ink-soft); font-size: var(--text-table); }

/* toast */
#toast { position: fixed; left: 50%; bottom: calc(var(--tabbar) + var(--space-sm) + env(safe-area-inset-bottom, 0px)); z-index: 60; transform: translate(-50%, 8px); max-width: calc(100% - 32px); padding: var(--space-2xs) var(--space-sm); border-radius: var(--radius-md); background: var(--color-ink); color: var(--color-on-ink); font-size: var(--text-small); font-weight: var(--fw-semibold); opacity: 0; pointer-events: none; transition: opacity var(--motion-base) var(--ease-standard), transform var(--motion-base) var(--ease-standard); }

/* === 6. Motion and forced colours === */
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

}

/* === 7. Now === */
.mast.st { margin-block-end: var(--space-sm); }

.opt-w { display: block; margin-block-start: 2px; font-size: var(--text-table); line-height: var(--lh-lead); }
.opt-n { display: block; font-size: var(--text-small); color: var(--color-ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nfold { margin-block-start: var(--space-3xs); }
.nfold > summary { display: flex; align-items: center; min-height: var(--tap); cursor: pointer; font-size: var(--text-table); font-weight: var(--fw-semibold); color: var(--color-accent-text); }

.nx-line { display: grid; grid-template-columns: 3.2rem minmax(0, 1fr); gap: 0 var(--space-2xs); min-height: var(--tap); margin-block-start: var(--space-xs); padding-block-start: var(--space-xs); border-block-start: 1px dashed var(--color-line-strong); text-decoration: none; color: inherit; font-size: var(--text-table); line-height: var(--lh-tight); }
.nx-line .tm { font-family: var(--font-mono); font-weight: var(--fw-bold); }

/* === 8. Programme === */
