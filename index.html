zhao","zeynep-basaran-bundur","zhendi-wang","zhengwu-jiang","zijian-jia"]}],"agenda":[{"day":"2026-10-17","t0":"15:00","t1":"20:00","title":"Registration","where":"main","kind":"reg","sub":"For early arrivals"},{"day":"2026-10-18","t0":"09:00","t1":"20:00","title":"Registration","where":"main","kind":"reg"},{"day":"2026-10-19","t0":"12:30","t1":"14:00","title":"Lunch","where":"buffet","kind":"meal","derived":true},{"day":"2026-10-19","t0":"","t1":"","title":"Dinner","kind":"meal","evening":true,"where":"buffet"},{"day":"2026-10-20","t0":"12:20","t1":"14:00","title":"Lunch","where":"buffet","kind":"meal","derived":true},{"day":"2026-10-20","t0":"","t1":"","title":"Banquet","kind":"meal","evening":true,"where":"qa"},{"day":"2026-10-21","t0":"11:40","t1":"13:30","title":"Lunch","where":"buffet","kind":"meal","derived":true}],"orgs":{"hosts":[{"name":"Southeast University","profile":"<p>Located in Nanjing, the ancient capital of six dynasties, Southeast University (SEU) is a prestigious university with a strong reputation both in China and abroad. Founded in 1902, SEU is a comprehensive, research-oriented university with engineering as its defining strength. As a national key university directly under the Ministry of Education and jointly supported by Jiangsu Province, Southeast University is one of the universities included in China's Project 985 and Project 211. In 2017, SEU was selected as a Class A university under China's Double First-Class initiative.<\u002fp>\n<p>SEU has 39 schools and departments, 3,070 full-time faculty members and 43,651 full-time students, including 2,381 international students. Twelve disciplines at SEU are listed in China's Double First-Class Initiative, tying for eighth nationwide. Eighteen disciplines rank among the top 1% worldwide in ESI, with Engineering ranked 13th and Computer Science 5th globally—both in the top 0.01%. Materials Science, Chemistry and Clinical Medicine rank among the top 0.1% in ESI.<\u002fp>\n<p>SEU has established close partnerships with more than 60 world-class universities and high-level research institutions from over 20 countries and regions. SEU spearheaded the establishment of the first UK-China University Consortium on Engineering Education and Research and the first World University Alliance on Carbon Neutrality. It has also established 24 international joint research platforms in areas such as architecture, communications, biomedicine, zero-carbon energy, and intelligent manufacturing.<\u002fp>"},{"name":"RILEM","profile":"<p>Founded in 1947, RILEM is the International Union of Laboratories and Experts in Construction Materials, Systems and Structures. Its mission is to advance free-access scientific knowledge related to construction materials, systems and structures and to encourage transfer and application of this knowledge world-wide. RILEM brings together leading experts in construction practice and science including academics, researchers, testing laboratories and authorities.<\u002fp>\n<p>RILEM main goals are to promote sustainable and safe construction, and improved performance and cost benefit for society; to stimulate new directions of research and its applications, promoting excellence in construction; to favor and promote interdisciplinary and multidisciplinary cooperation at international scale by open access to advanced knowledge.<\u002fp>\n<p>At the heart of RILEM's work are its international Technical Committees. They bring together experts across disciplines and countries to examine emerging topics, assess research findings and publish state-of-the-art reports and technical recommendations. RILEM's conferences and educational activities provide further opportunities to exchange knowledge and involve young researchers.<\u002fp>\n<p>Digital fabrication is one of the fields addressed by this work. Two RILEM Technical Committees working on concrete printing will meet during DC2026, on Sunday, the 18th of October: <strong>TC 303-PFC<\u002fstrong>, Performance requirements and testing of fresh printable cement-based materials, and <strong>TC 304-ADC<\u002fstrong>, Assessment of additively manufactured concrete materials and structures.<\u002fp>\n<p>RILEM is delighted to welcome participants to DC2026, held jointly with the 2026 edition of the International Conference on 3D Printing Concrete Materials and Structures (3DPCMS). Bringing together researchers and industry professionals from around the world, this joint conference offers a major opportunity to advance knowledge and collaboration in digital concrete and 3D printing in construction.<\u002fp>"},{"name":"State Key Laboratory of Engineering Materials for Major Infrastructure","profile":"<p>The State Key Laboratory of Engineering Materials for Major Infrastructure was approved for establishment in December 2024 through the reorganization of the State Key Laboratory of High Performance Civil Engineering Materials. It is jointly hosted by Jiangsu Sobute New Materials Co., Ltd., Southeast University, and Jiangsu Research Institute of Building Science Co., Ltd. Academicians of the Chinese Academy of Engineering, Miao Changwen and Liu Jiaping, serve as Chief Scientist and Director, respectively.<\u002fp>\n<p>The Laboratory addresses the demand for high-strength, tough, durable, and low-carbon engineering materials for major infrastructure subjected to complex loading, harsh environments, and extreme conditions. Its fundamental research focuses on the mechanisms governing material performance across scales, time-dependent damage under coupled factors, and the integration of data and knowledge. Key technological priorities include simultaneously enhancing strength and toughness, ensuring exceptionally long service life, scaling up the production of advanced materials, and enabling multi-objective intelligent design. The Laboratory also advances 3D intelligent construction for major infrastructure, including rheology control, low-carbon and recycled printable materials, architected cementitious metamaterials, and lunar 3D printing.<\u002fp>\n<p>It has more than 200 permanent staff, including two academicians of the Chinese Academy of Engineering and 18 nationally recognized research talents. Its research facilities comprise over 2,000 instruments and equipment sets valued at more than RMB 200 million, supporting investigations from molecular structure to macroscopic performance. Pilot production lines facilitate the translation of research findings into engineering applications. By advancing fundamental theories and transformative technologies across the material life cycle, the Laboratory aims to become an international leader in engineering materials research, technical standards development, and innovative applications.<\u002fp>"},{"name":"China Concrete & Cement-based Products Association (CCPA)","profile":"<p>China Concrete &amp; Cement-based Products Association (CCPA) was founded in 1986. It is a national industrial association registered with the Ministry of Civil Affairs. Voluntarily formed by enterprises, institutions and relevant social organizations along the industrial chain, CCPA aims to boost the growth of concrete and cement-based products industry. Its services basically cover material R&amp;D, design, manufacturing, construction and equipment across upstream and downstream sectors, with over 2,100 members.<\u002fp>\n<p>Upholding the principle of innovative development, the Association adheres to the tenet of \"independence, self-reliance, self-improvement and self-discipline\". It fully implements the development philosophy of innovation, coordination, green development, openness and sharing, improves service resources and capacity for governments, the public, enterprises and members, and develops branded services with industrial features.<\u002fp>\n<p>Its secretariat runs 13 functional departments and oversees 33 branches, delivering high-quality all-round services covering quality standards, technology promotion, policy research, conferences &amp; exhibitions, credit evaluation, international cooperation as well as education and training. Abiding by laws and practicing core socialist values, CCPA commits itself to serving members, industry, government and society as an industrial guide and service provider.<\u002fp>"},{"name":"Sobute New Materials Co., Ltd. (Sobute)","profile":"<p>Sobute New Materials Co., Ltd. (Sobute for short) is a leading provider of advanced civil engineering materials. It specializes in the research and development, manufacturing, and sales of concrete admixtures, while continuously making breakthroughs in the development and commercialization of functional products, including waterproofing and repair materials and transportation infrastructure materials.<\u002fp>\n<p>Sobute has consistently pursued a development strategy driven by technological innovation. It has established a number of leading research and development platforms, including the National Key Laboratory of Materials for Major Infrastructure Engineering. It has also built a highly specialized and experienced technical talent pool characterized by comprehensive professional expertise, a well-balanced age structure, strong innovation capabilities, and extensive experience in technology commercialization.<\u002fp>\n<p>Sobute operates under a group-based management and chain-based operating model, with manufacturing bases established across Jiangsu, Sichuan, Tianjin, Xinjiang, Guangdong, Guangxi, and other regions. It has established and maintained an integrated management system covering quality, environmental management, occupational health and safety, and measurement management. Automated process control has been implemented throughout the entire manufacturing process.<\u002fp>\n<p>Sobute adheres to a customer-centric philosophy and provides customers with consultative technical and marketing services, which is supported by highly qualified professional personnel and advanced testing facilities. Sobute's products have been successfully applied in a large number of major national infrastructure projects, including the Hong Kong-Zhuhai-Macao Bridge, Shenzhen-Zhongshan Link, Tianwan Nuclear Power Plant, Baihetan Hydropower Station, Lanzhou-Xinjiang High-Speed Railway, South-to-North Water Diversion Project, Wuxi Taihu Tunnel, and so on.<\u002fp>\n<p>Guided by its corporate mission of \"Creating Better Materials, Building a Better Future,\" Sobute upholds the core values of \"Openness, Innovation, Integrity and Win-Win Cooperation\", and continuously seeks to create value for all stakeholders and aspires to become a modern technology-driven enterprise that leads the industry and earns the respect of society.<\u002fp>"}],"sponsors":[{"name":"3D Kenyo Printing","tier":"Platinum","full":"3D Kenyo Printing (Nanjing Kenyo Precision Machine Manufacture Shares Co., Ltd)","profile":"<p>Nanjing Kenyo Precision Machine Manufacture Shares Co., Ltd is a leading integrated provider of 3D concrete printing technology in China. The Company delivers end-to-end solutions spanning independently developed 3D printing equipment, UHPC core printing materials, and comprehensive printing services for diverse construction applications. With more than 140 core technology patents, Kenyo has established a robust independent intellectual-property portfolio and a strong foundation for continuous innovation. Dedicated to the intelligent development of 3D concrete printing, Kenyo combines engineering expertise with self-developed AI model systems to advance smarter, more efficient construction. Its dual-headquarters strategy connects its China headquarters in Nanjing with its overseas headquarters in Abu Dhabi, UAE, supporting an international network for research and development, operations, project delivery, and customer service.<\u002fp>\n<p>Kenyo's mature and reliable technology has been validated through a range of landmark projects in China and abroad. These include printed buildings, villa applications, highway sound barriers, and municipal facilities, as well as a 300-square-meter 3D-printed warehouse and a 1,200-square-meter 3D-printed exhibition hall in Abu Dhabi. The Company is also developing a 38,000-square-meter intelligent factory in Abu Dhabi, planned to commence operations by the end of 2026, further strengthening global production capacity and service reach.<\u002fp>\n<p>Compared with conventional construction methods, Kenyo's 3D concrete printing solutions offer faster execution, controllable costs, and intelligent manufacturing capabilities. They are well suited to villas, warehouses, industrial facilities, public infrastructure, and other building scenarios, providing modern construction with lighter, smarter, and more cost-effective ways to build.<\u002fp>"},{"name":"VERTICO","tier":"Platinum","full":"VERTICO","profile":"<p>Vertico is a Dutch technology company at the forefront of robotic 3D concrete printing, developing advanced solutions for architecture, construction, education and research. With more than 60 systems sold across six continents, we are the leaders or our field, with a significant share of our systems installed at universities, educational institutions and research organisations.<\u002fp>\n<p>Collaboration with academia is a central part of Vertico's development. We work closely with universities and research institutes on material development, new printing technologies and applications for digital concrete manufacturing. Vertico participates in numerous research projects and grant-funded programmes, while also supporting independent and commercially funded research. This continuous interaction between industry and academia helps advance both our own technology and the wider field of 3D concrete printing.<\u002fp>\n<p>Our fully integrated solutions combine robotic systems, concrete printheads and dedicated software, delivering high print quality, ease of use and exceptional geometric freedom. Systems range from accessible research and educational platforms to advanced solutions for industrial production. We even have a collaborative robot system designed specifically for academia called our LabCell.<\u002fp>\n<p>At the core of our most advanced technology is the Accelerator Printhead (2K). Its advanced mixing introduces liquid accelerant directly at the nozzle, allowing concrete to harden within seconds. This enables large overhangs, intricate patterns, complex geometries and non-planar printing while maintaining precision and consistent print quality.<\u002fp>\n<p>Vertico further expands these possibilities through robotic concrete milling. By combining additive and subtractive manufacturing within a single robotic workflow, printed concrete can be precisely milled to create smooth surfaces, sharp details and complex finishes.<\u002fp>"},{"name":"NIUMAG (纽迈)","tier":"Gold","full":"NIUMAG","profile":"<p>NIUMAG Analysis, a high-tech enterprise founded in 2003, delivers end-to-end low-field nuclear magnetic resonance (LF-NMR) solutions. Its business scope covers R&amp;D and sales of instruments, professional application technology support, and third-party testing services. The company has independently developed a full portfolio of low-field NMR instruments, breaking overseas technical monopolies.<\u002fp>\n<p>Its systems are widely used in energy, cementitious materials, geotechnical engineering, oilfield services, food and agriculture, life sciences, materials science, education, and textiles. Its wholly-owned subsidiary, Suzhou TAINIU, operates a CNAS and CMA-accredited laboratory, providing reliable LF-NMR testing and customized analytical solutions. With over 20 years of expertise in LF-NMR technology, NIUMAG undertakes the National Major Scientific Instrument Project, hosts a National Postdoctoral Research Station, and has been recognized as a national Specialized, Refined, Differential and Innovative \"Little Giant\" Enterprise. Listed on NEEQ (stock code: 836507), NIUMAG pursues continuous technological innovation and popularization of scientific education, striving to build a world-leading magnetic resonance brand.<\u002fp>\n<p>Our partners engaged in cement-based material research include Tsinghua University, Southeast University, Tongji University, Wuhan University of Technology, Shenzhen University, University of Jinan and Jiangsu Sobute New Materials Co., Ltd. International clients cover Harvard University, University of Vienna, Khalifa University, Saint-Gobain and Saudi Aramco.<\u002fp>"},{"name":"ZHICHUANGCHI (智创驰)","tier":"Gold","full":"ZHICHUANGCHI (Xiamen Zhichuangchi Technology Co., Ltd.)","profile":"<p>Note: in the printed program, the profile text on this page is an exact copy of the NIUMAG profile above (likely a printing error). No separate description of Zhichuangchi is given.<\u002fp>"},{"name":"HOLCIM","tier":"Gold","full":"Holcim","profile":"<p>Headquartered in Zug, Switzerland, Holcim is the world's leading partner for sustainable construction, with net sales of CHF 15.7 billion in 2025. Present across 45 markets in Europe, Latin America, Asia, the Middle East and Africa, the Group employs more than 50,000 people and is recognized as a Global Top Employer. Guided by its purpose of \"building progress for people and the planet,\" Holcim weaves sustainability and innovation through cement, ready-mix concrete, aggregates and building solutions, spanning infrastructure, industrial facilities and residential and commercial buildings.<\u002fp>\n<p>Its NextGen Growth 2030 strategy answers the defining forces reshaping cities: rapid urbanization, large-scale energy refurbishment, stricter climate codes, the shift to modular and offsite construction, and the localisation of supply chains. A complete portfolio spans foundations, flooring, walling and roofing. Flagship brands include ECOPlanet low-carbon cement, ECOPact green concrete and ECOCycle circular technology, which converts construction and demolition waste into reusable aggregates—advancing the vision of \"building cities from cities\" and easing the strain on virgin resources.<\u002fp>\n<p>Holcim pursues science-based net-zero goals aligned with 1.5°C pathways, combining calcined clay supplementary cementitious materials, energy-efficient plants and carbon capture platforms such as CaptureLab, while engineering durable, climate-resilient materials that cut the whole-life carbon of built assets. Through open cooperation, the Group drives industry-wide standardization: long-term partnerships with universities, engineering firms and industrial organisations scale circular techniques and low-carbon materials across the value chain. Backed by rigorous safety management, local community engagement and continuous workforce development, Holcim operates responsibly in every market it serves.<\u002fp>\n<p>Committed to transforming the built environment, Holcim delivers practical, scalable solutions for greener, smarter and more resilient infrastructure worldwide.<\u002fp>"},{"name":"GUANLI (冠力)","tier":"Gold","full":"GUANLI (Hangzhou Guanli Intelligent Technology Co., Ltd.)","profile":"<p>Guanli Technology has been dedicated to intelligent construction for more than a decade and is a leading full-scope provider of 3D-printed building solutions. Headquartered in Xiaoshan, Hangzhou, the company has branches in Beijing, Shandong and Shanxi, as well as in Japan, Singapore and Dubai.<\u002fp>\n<p>The company's concrete and mortar 3D printing equipment covers three series — laboratory, factory and on-site — in more than 20 models. MOLI, its fully self-developed intelligent control system for 3D-printed building, integrates multiple algorithms, requires no third-party slicing or offline programming, and converts models into printing paths in seconds. This greatly reduces operational difficulty and improves efficiency, meeting the industrialised, large-scale construction needs of 3D-printed buildings. The company holds 6 invention patents and 17 utility model patents, along with other intellectual property, and has led or participated in the formulation of more than 30 industry standards.<\u002fp>\n<p>Over the past five years, the company has completed more than 1,000 3D-printed projects and products worldwide — houses, bridges, municipal facilities, outdoor furniture, sculptures and marine structures — repeatedly pioneering the industry and twice winning global architectural design awards. Flagship projects include five 9-metre-high nest-style hotel buildings in Jinchang, Gansu; a 16-metre pedestrian bridge in Ningbo, Zhejiang; a 5,600 m² mosque in Jeddah, Saudi Arabia; Singapore's first in-situ 3D-printed kindergarten; and a 430 m² two-storey in-situ 3D-printed villa in Dubai. Its market reaches more than 20 countries and regions overseas — including the United States, Singapore, Australia, Japan and Saudi Arabia — and serves more than 1,000 clients.<\u002fp>"}],"supporting":["Chinese Ceramic Society","CCCC First Highway Consultants Co., Ltd.","China Resources Building Materials Technology Holdings Limited","Nanjing Institute for Intelligent Additive Manufacturing Co., Ltd"]},"taxi":[{"id":"tx-venue","place":"Conference venue: Holiday Inn Nanjing Qinhuai South","zh":"南京上秦淮假日酒店","addr":"南京市江宁区秣周东路21号","phone":"+86 25 8490 8888","notes":"Conference venue and hotel. Metro Line 3, Mozhou East Road (<span lang=\"zh-Hans\" class=\"zh-in\">秣周东路<\u002fspan>), exit 2, about 200 m.","ask":["请带我去这里","Please take me here"],"amap":[{"n":"南京上秦淮假日酒店","u":"https://uri.amap.com/search?keyword=%E5%8D%97%E4%BA%AC%E4%B8%8A%E7%A7%A6%E6%B7%AE%E5%81%87%E6%97%A5%E9%85%92%E5%BA%97&city=%E5%8D%97%E4%BA%AC&src=dc2026-guide&callnative=1"}]},{"id":"tx-metro","place":"Metro: Mozhou East Road station (Line 3, exit 2)","zh":"秣周东路站（3号线，2号口）","addr":"南京市江宁区秣周东路","phone":"","notes":"About 200 m from the venue. Line 3 north to Nanjing South and the old centre.","ask":["请带我去这里","Please take me here"],"amap":[{"n":"秣周东路站","u":"https://uri.amap.com/search?keyword=%E7%A7%A3%E5%91%A8%E4%B8%9C%E8%B7%AF%E7%AB%99&city=%E5%8D%97%E4%BA%AC&src=dc2026-guide&callnative=1"}]},{"id":"tx-nanjing-south","place":"Nanjing South railway station","zh":"南京南站","addr":"","phone":"","notes":"High-speed trains to Shanghai and beyond. To the venue: Line 3 southbound, 7 stops to <span lang=\"zh-Hans\" class=\"zh-in\">秣周东路<\u002fspan>, exit 2.","ask":["请带我去这里","Please take me here"],"amap":[{"n":"南京南站","u":"https://uri.amap.com/search?keyword=%E5%8D%97%E4%BA%AC%E5%8D%97%E7%AB%99&city=%E5%8D%97%E4%BA%AC&src=dc2026-guide&callnative=1"}]}],"glance":{"intro":"<p>All sessions are in the venue hotel, Holiday Inn Nanjing Qinhuai South (<span lang=\"zh-Hans\" class=\"zh-in\">南京上秦淮假日酒店<\u002fspan>). Buffet meals are on the 1st floor.<\u002fp>","rows":[["Sat 17 Oct","Registration for early arrivals 15:00–20:00","Main Hall, 1F"],["Sun 18 Oct","Registration 09:00–20:00 · RILEM TC 303-PFC 09:00–12:00 · TC 304-ADC 14:00–17:00 · Lunch 12:00–14:00 · Buffet dinner 18:00–20:00","Registration: Main Hall 1F · TC meetings: UPark Room 5F · Meals: buffet 1F"],["Mon 19 Oct","08:30 Opening ceremony and group photo · Plenary Session 1 09:00–12:30 · Lunch buffet · Parallel sessions 1–5 14:00–17:40 · Buffet dinner","Opening and plenary: Qinhuai Amazing 3F · Parallel sessions: five rooms on 3F and 5F"],["Tue 20 Oct","Parallel sessions 6–10 08:30–11:40 · Poster pitches 11:40–12:20, 3 min per poster · Lunch buffet · Parallel sessions 11–15 14:00–17:20 · Evening: conference banquet","Five rooms on 3F and 5F · Banquet: Qinhuai Amazing 3F"],["Wed 21 Oct","Parallel sessions 16–20 08:30–11:40 · Lunch buffet · Plenary Session 2 13:30–16:30 · 16:30 RILEM digital concrete award lecture · 17:00–17:30 Closing ceremony","Plenary, award lecture and closing: Qinhuai Amazing 3F"]],"after":"<p>There is no excursion or technical visit in the programme. The doctoral course runs on 16–17 Oct at Southeast University (<span lang=\"zh-Hans\" class=\"zh-in\">东南大学<\u002fspan>).<\u002fp>"},"getting":{"intro":"<p>The venue is in Jiangning district, in the southern suburbs, about 20 km from the old centre. Metro: Line 3, Mozhou East Road (<span lang=\"zh-Hans\" class=\"zh-in\">秣周东路<\u002fspan>), exit 2, about 200 m from the hotel.<\u002fp>","subs":[["From Nanjing South railway station","<ol>\n<li><strong>Metro (cheapest):<\u002fstrong> Line 3 southbound, 7 stops to <span lang=\"zh-Hans\" class=\"zh-in\">秣周东路<\u002fspan> (Mozhou East Road), exit 2. About 30 min, ¥3–6.<\u002fli>\n<li><strong>Taxi or Didi:<\u002fstrong> 20–30 min, about ¥30–55. Show the venue taxi card.<\u002fli>\n<\u002fol>"],["From Nanjing Lukou airport (NKG)","<ol>\n<li><strong>Taxi or Didi (easiest with luggage):<\u002fstrong> official taxi rank outside arrivals, or Didi in Alipay. 35–45 min, about ¥90–140; a toll may be added.<\u002fli>\n<li><strong>Metro:<\u002fstrong> S1 from the airport basement to Nanjing South (about 35 min), then Line 3 southbound to <span lang=\"zh-Hans\" class=\"zh-in\">秣周东路<\u002fspan>, exit 2 (20–30 min). About 70 min in total, about ¥10. S1 runs from about 06:00 to 22:00, every 10 min.<\u002fli>\n<\u002fol>"],["From Shanghai Pudong airport (PVG), by train","<ol>\n<li><strong>Pudong → Hongqiao station:<\u002fstrong> Airport Link Line (<span lang=\"zh-Hans\" class=\"zh-in\">机场联络线<\u002fspan>), under 40 min, about ¥26. Metro Line 2 is cheaper but takes about 90 min; a taxi takes about 60 min and costs ¥200+.<\u002fli>\n<li><strong>Hongqiao → Nanjing South:<\u002fstrong> high-speed G-train, 1–1.5 h, about ¥140–185 in 2nd class, every 15–30 min. Book in the 12306 app or a travel app.<\u002fli>\n<li><strong>Nanjing South → venue:<\u002fstrong> Line 3 southbound to <span lang=\"zh-Hans\" class=\"zh-in\">秣周东路<\u002fspan>, exit 2 (see above).<\u002fli>\n<\u002fol>\n<p>Allow 3–4 hours door to door from landing.<\u002fp>"],["Train tips","<ul>\n<li>Be at big stations (Hongqiao, Nanjing South) 45–60 min early. The gates close about 5 min before departure.<\u002fli>\n<li>Foreign passports don't work at the e-gates: use the staffed lane (<span lang=\"zh-Hans\" class=\"zh-in\">人工通道<\u002fspan>) with the passport you booked with.<\u002fli>\n<\u002ful>"]]},"practical":[["Alipay and WeChat Pay","Almost everything is paid by QR code. Alipay with a linked foreign card works almost everywhere and includes Didi (taxis) and the metro QR code. WeChat Pay is the backup; it charges 3% on payments over ¥200 with a foreign card."],["Cash","Carry some small notes (¥200–500) for small stalls. ATMs at the airport, stations and banks take foreign cards. Tipping is not expected."],["Power plugs","220 V, sockets type A, C and I. Most EU plugs (type C) fit; bring an adapter for anything grounded."],["Phone, eSIM and VPN","A foreign eSIM with China data gives you Google, WhatsApp and Gmail without a VPN. On hotel or conference Wi-Fi you need a VPN, installed before you fly. Google Maps is unreliable in China: use Amap (<span lang=\"zh-Hans\" class=\"zh-in\">高德地图<\u002fspan>) or Apple Maps."],["Getting around","Metro ¥2–7, signed in English; pay with the Alipay transport QR code (search <span lang=\"zh-Hans\" class=\"zh-in\">南京地铁<\u002fspan> in Alipay). Taxi ¥11 for the first 3 km, then about ¥2.4/km; drivers rarely speak English, so show the Chinese. Into the old centre: Line 3, about 40 min."],["Emergency numbers","Police 110 · Ambulance 120 · Fire 119"],["Water and toilets","Don't drink tap water: bottled or boiled is fine. Bring tissues; many public toilets have no paper."],["Weather (late Oct)","About 21 °C by day and 12 °C at night, with a fair chance of rain. Bring layers and an umbrella."]],"contacts":[["General information","digitalconcrete2026@gmail.com"],["Oral presentation file","x.liu@seu.edu.cn"],["Other issues — Yamei Zhang","ymzhang@seu.edu.cn"],["Other issues — Yu Chen","y_chen@seu.edu.cn"],["Other issues — Wenqiang Zuo","wenqiangzuo@seu.edu.cn"],["Other issues — Zijian Jia","jzjjzj18@163.com"]],"phrases":[{"group":"At the venue","items":[{"en":"Where is the Qinhuai Amazing hall? (3F)","zh":"请问，3楼的尚秦淮厅在哪里？","py":"Qǐngwèn, sān lóu de Shàng Qínhuái Tīng zài nǎli?"},{"en":"Where is Qinhuai Amazing A? (3F)","zh":"请问，3楼的尚秦淮A厅在哪里？","py":"Qǐngwèn, sān lóu de Shàng Qínhuái A Tīng zài nǎli?"},{"en":"Where is Qinhuai Amazing B? (3F)","zh":"请问，3楼的尚秦淮B厅在哪里？","py":"Qǐngwèn, sān lóu de Shàng Qínhuái B Tīng zài nǎli?"},{"en":"Where is the ULake Room? (3F)","zh":"请问，3楼的悠湖厅在哪里？","py":"Qǐngwèn, sān lóu de Yōuhú Tīng zài nǎli?"},{"en":"Where is the Knowledge Room? (5F)","zh":"请问，5楼的智慧厅在哪里？","py":"Qǐngwèn, wǔ lóu de Zhìhuì Tīng zài nǎli?"},{"en":"Where is the UPark Room? (5F)","zh":"请问，5楼的悠谷厅在哪里？","py":"Qǐngwèn, wǔ lóu de Yōugǔ Tīng zài nǎli?"},{"en":"Where is the toilet?","zh":"请问，洗手间在哪里？","py":"Qǐngwèn, xǐshǒujiān zài nǎli?"},{"en":"Where is the lift?","zh":"请问，电梯在哪里？","py":"Qǐngwèn, diàntī zài nǎli?"},{"en":"Where is the registration desk?","zh":"请问，会议报到处在哪里？","py":"Qǐngwèn, huìyì bàodàochù zài nǎli?"},{"en":"What is the Wi-Fi password?","zh":"WiFi密码是多少？","py":"WiFi mìmǎ shì duōshao?"},{"en":"Where can I charge my phone?","zh":"请问，哪里可以给手机充电？","py":"Qǐngwèn, nǎli kěyǐ gěi shǒujī chōngdiàn?"},{"en":"Is this seat free?","zh":"这个位子有人吗？","py":"Zhège wèizi yǒu rén ma?"}]},{"group":"Food (buffet and banquet)","items":[{"en":"I am vegetarian.","zh":"我吃素。","py":"Wǒ chī sù."},{"en":"I don't eat pork.","zh":"我不吃猪肉。","py":"Wǒ bù chī zhūròu."},{"en":"I don't eat beef.","zh":"我不吃牛肉。","py":"Wǒ bù chī niúròu."},{"en":"I don't eat seafood.","zh":"我不吃海鲜。","py":"Wǒ bù chī hǎixiān."},{"en":"I don't eat nuts.","zh":"我不吃坚果。","py":"Wǒ bù chī jiānguǒ."},{"en":"I'm allergic to nuts and peanuts.","zh":"我对坚果和花生过敏。","py":"Wǒ duì jiānguǒ hé huāshēng guòmǐn."},{"en":"Is this spicy?","zh":"这个辣吗？","py":"Zhège là ma?"},{"en":"Not spicy, please.","zh":"不要辣，谢谢。","py":"Bú yào là, xièxie."},{"en":"A coffee, please.","zh":"请给我一杯咖啡。","py":"Qǐng gěi wǒ yì bēi kāfēi."},{"en":"A tea, please.","zh":"请给我一杯茶。","py":"Qǐng gěi wǒ yì bēi chá."},{"en":"A glass of hot water, please.","zh":"请给我一杯热水。","py":"Qǐng gěi wǒ yì bēi rèshuǐ."}]},{"group":"Networking","items":[{"en":"Nice to meet you. I work in 3D concrete printing.","zh":"很高兴认识您，我是做混凝土3D打印的。","py":"Hěn gāoxìng rènshi nín, wǒ shì zuò hùnníngtǔ sān-D dǎyìn de."},{"en":"Shall we add each other on WeChat?","zh":"可以加个微信吗？","py":"Kěyǐ jiā ge Wēixìn ma?"},{"en":"Can I scan your WeChat code?","zh":"我扫您的二维码，可以吗？","py":"Wǒ sǎo nín de èrwéimǎ, kěyǐ ma?"},{"en":"Please scan my WeChat code.","zh":"请扫我的二维码。","py":"Qǐng sǎo wǒ de èrwéimǎ."},{"en":"May I take a photo of your poster?","zh":"我可以拍一下您的海报吗？","py":"Wǒ kěyǐ pāi yíxià nín de hǎibào ma?"},{"en":"May I take a photo of this slide?","zh":"我可以拍一下这页PPT吗？","py":"Wǒ kěyǐ pāi yíxià zhè yè PPT ma?"},{"en":"Do you have a business card?","zh":"您有名片吗？","py":"Nín yǒu míngpiàn ma?"},{"en":"I want to buy a Vertico 3D concrete printer!","zh":"我想买一台Vertico混凝土3D打印机！","py":"Wǒ xiǎng mǎi yì tái Vertico hùnníngtǔ sān-D dǎyìnjī!"}]},{"group":"Help","items":[{"en":"I'm lost. Please call this number for me.","zh":"我迷路了，请帮我打这个电话。","py":"Wǒ mílù le, qǐng bāng wǒ dǎ zhège diànhuà."},{"en":"Please write it down for me.","zh":"请帮我写下来。","py":"Qǐng bāng wǒ xiě xiàlai."},{"en":"I don't speak Chinese.","zh":"我不会说中文。","py":"Wǒ bú huì shuō Zhōngwén."}]}],"phrases_intro":"<p>Show the Chinese; the pinyin is there if you want to try saying it. Tone changes of <span lang=\"zh-Hans\" class=\"zh-in\">一<\u002fspan> and <span lang=\"zh-Hans\" class=\"zh-in\">不<\u002fspan> are written as spoken (yì bēi, bú yào). Room names follow the venue signs (3<span lang=\"zh-Hans\" class=\"zh-in\">楼<\u002fspan> <span lang=\"zh-Hans\" class=\"zh-in\">尚秦淮A厅<\u002fspan>).<\u002fp>"}</script>
<script>(function () {
  'use strict';
  var D = JSON.parse(document.getElementById('data').textContent);
  var C = D.cfg, KEY = C.key;
  var view = document.getElementById('view');
  var OVER = {}, CLICK = [], INPUT = [], TICK = []; // overlay renderers by route; per-tab hooks for taps, typing and the clock
  var RM = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

  // ---------- helpers ----------
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function zh(t, cls) { return t ? '<span class="zh' + (cls ? ' ' + cls : '') + '" lang="zh-Hans">' + esc(t) + '</span>' : ''; }
  function each(sel, fn, root) { Array.prototype.forEach.call((root || document).querySelectorAll(sel), fn); }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); }
  var CJK_RE = /[\u2e80-\u9fff\uf900-\ufaff\uff00-\uffef]/;
  function txt(t) { return CJK_RE.test(t) ? '<span class="zh-in" lang="zh-Hans">' + esc(t) + '</span>' : esc(t); } // what people type may be Chinese

  // ---------- storage: localStorage, prefix dc26:, keyed by stable ids (never by file version) ----------
  function sget(k, d) { try { var v = localStorage.getItem(KEY + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
  function sset(k, v) {
    try {
      if (v === null || v === '' || v === false || v === 0) localStorage.removeItem(KEY + k);
      else { localStorage.setItem(KEY + k, JSON.stringify(v)); keepStorage(k); }
      return true;
    } catch (e) { toast('Could not save on this phone', true); return false; }
  }
  // after the first saved star, note, flag, contact or added person of this visit, ask the browser to keep the
  // site's storage under pressure (brief call 46): never on load, no prompt in Chrome, failures ignored, no new key
  var keepAsked = false;
  function keepStorage(k) {
    if (keepAsked || !/^(s|n|m|pn|pc|pp):/.test(k)) return;
    keepAsked = true;
    try {
      var st = navigator.storage;
      if (st && st.persist && st.persisted) st.persisted().then(function (y) { return y || st.persist(); }).catch(function () { /* ignore */ });
    } catch (e) { /* ignore */ }
  }
  function skeys(prefix) {
    var out = [], p = KEY + prefix;
    try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k && k.indexOf(p) === 0) out.push(k.slice(p.length)); } } catch (e) { /* no storage */ }
    return out;
  }

  // ---------- Beijing time (same helpers as the trip apps) ----------
  function msAt(iso, hm, tz) {
    var a = iso.split('-'), b = (hm || '00:00').split(':');
    return Date.UTC(+a[0], +a[1] - 1, +a[2], +b[0] - (tz == null ? 8 : tz), +b[1]);
  }
  var FMT = null;
  try { FMT = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }); } catch (e) { FMT = null; }
  function bj(ms) {
    if (FMT && FMT.formatToParts) {
      var o = {};
      FMT.formatToParts(new Date(ms)).forEach(function (x) { o[x.type] = x.value; });
      return { iso: o.year + '-' + o.month + '-' + o.day, hm: (o.hour === '24' ? '00' : o.hour) + ':' + o.minute };
    }
    var s = new Date(ms + 8 * 3600e3).toISOString();
    return { iso: s.slice(0, 10), hm: s.slice(11, 16) };
  }
  // ?now=2026-10-19T14:30 pretends it is that moment in Beijing; the clock keeps ticking from there
  var OFFSET = 0, TEST = '';
  try {
    var qm = /^(\d{4}-\d\d-\d\d)T(\d\d:\d\d)$/.exec(new URLSearchParams(location.search).get('now') || '');
    if (qm) { OFFSET = msAt(qm[1], qm[2]) - Date.now(); TEST = qm[1] + ' ' + qm[2]; }
  } catch (e) { /* no URLSearchParams */ }
  function now() { return Date.now() + OFFSET; }
  function today() { return bj(now()).iso; }
  var WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], MO = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var WDF = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  function label(iso) { var d = new Date(iso + 'T00:00:00Z'); return WD[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + MO[d.getUTCMonth()]; }
  function longLabel(iso) { var d = new Date(iso + 'T00:00:00Z'); return WDF[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + MO[d.getUTCMonth()]; }
  function until(ms) {
    var m = Math.round((ms - now()) / 60000);
    if (m < 1) return 'now';
    if (m < 60) return 'in ' + m + ' min';
    var h = Math.floor(m / 60);
    if (h < 24) return 'in ' + h + ' h' + (m % 60 ? ' ' + (m % 60) + ' min' : '');
    var d = Math.floor(h / 24);
    return 'in ' + d + ' d' + (h % 24 ? ' ' + (h % 24) + ' h' : '');
  }
  function span(a, b) { return a ? a + (b ? '–' + b : '') : ''; }

  // ---------- data indexes ----------
  var ROOM = {}, SESS = {}, T = D.talks, PPL = D.people;
  D.rooms.forEach(function (r) { ROOM[r.id] = r; });
  D.sessions.forEach(function (s) {
    SESS[s.id] = s;
    if (s.t0) { s.a = msAt(s.day, s.t0); s.b = msAt(s.day, s.t1); }
    s.items.forEach(function (i) { if (typeof i === 'object') { i.s = s.id; if (i.t0) { i.a = msAt(s.day, i.t0); i.b = msAt(s.day, i.t1); } } });
  });
  Object.keys(T).forEach(function (id) { var t = T[id]; if (t.t0) { t.a = msAt(t.day, t.t0); t.b = msAt(t.day, t.t1); } });
  D.agenda.forEach(function (a) { if (a.t0) { a.a = msAt(a.day, a.t0); a.b = msAt(a.day, a.t1); } });
  var OPEN = msAt(C.open[0], C.open[1]), CLOSE = msAt(C.close[0], C.close[1]);
  var STARRABLE = { talk: 1, poster: 1 };

  // ---------- places ----------
  var PLACES = { buffet: ['Buffet', '1F'], main: ['Main Hall', '1F'] };
  function roomName(id) { return PLACES[id] ? PLACES[id][0] : ROOM[id] ? ROOM[id].en : ''; }
  function floorOf(id) { return PLACES[id] ? PLACES[id][1] : ROOM[id] ? ROOM[id].floor + 'F' : ''; }
  function whereText(id) { return id ? roomName(id) + ' · ' + floorOf(id) : ''; }
  function whereHtml(id) { return id ? '<span class="where">' + esc(roomName(id)) + ' · <span class="fl">' + esc(floorOf(id)) + '</span></span>' : ''; }
  function talkRoom(t) { return SESS[t.s] ? SESS[t.s].room : null; }

  // ---------- stars, notes, to-meet ----------
  function starred(id) { return !!sget('s:' + id, 0); }
  function starIds() { return skeys('s:').filter(function (id) { return T[id]; }); }
  function note(k) { return sget(k, '') || ''; }
  function meeting(pid) { return !!sget('m:' + pid, 0); }
  // two starred items that overlap in time, in different sessions (posters in one room share a slot: no clash)
  function clashMap() {
    var ids = starIds().filter(function (id) { return T[id].a; }), out = {};
    ids.forEach(function (a) {
      ids.forEach(function (b) {
        var x = T[a], y = T[b];
        if (a !== b && x.s !== y.s && x.a < y.b && y.a < x.b) (out[a] = out[a] || []).push(b);
      });
    });
    return out;
  }
  var SVG_STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 17l-5.4 2.9 1.1-6.1-4.5-4.2 6.1-.8z"/></svg>';
  var SVG_MEET = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.4"/><path d="M2.8 19.5c.6-3.4 3.2-5.4 6.2-5.4s5.6 2 6.2 5.4z"/><path d="M17 8v6M14 11h6"/></svg>';
  var SVG_MET = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.4"/><path d="M2.8 19.5c.6-3.4 3.2-5.4 6.2-5.4s5.6 2 6.2 5.4z"/><path d="M14.5 11.2l2.2 2.2 4-4.4"/></svg>';
  var SVG_X = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  var SVG_OUT = '<svg viewBox="0 0 24 24" aria-hidden="true" width="14" height="14" style="margin-inline-start:3px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M14 4h6v6M20 4l-9 9M18 14v5H5V6h5"/></svg>';
  function starBtn(id, wide) {
    if (!T[id] || !STARRABLE[T[id].kind]) return '';
    var on = starred(id), lab = (on ? 'Starred: ' : 'Star: ') + T[id].title;
    if (wide) return '<button type="button" class="btn star-btn" data-star="' + esc(id) + '" aria-pressed="' + on + '">' + SVG_STAR + '<span>' + (on ? 'Starred' : 'Star') + '</span></button>';
    return '<button type="button" class="star" data-star="' + esc(id) + '" aria-pressed="' + on + '" aria-label="' + esc(lab) + '">' + SVG_STAR + '</button>';
  }
  function meetBtn(pid, wide) {
    var on = meeting(pid), lab = (on ? 'On your to-meet list: ' : 'Want to meet: ') + (PPL[pid] ? PPL[pid].name : 'this person');
    if (wide) return '<button type="button" class="btn meet" data-meet="' + esc(pid) + '" aria-pressed="' + on + '">' + (on ? SVG_MET : SVG_MEET) + '<span>' + (on ? 'On my to-meet list' : 'Want to meet') + '</span></button>';
    return '<button type="button" class="star meet" data-meet="' + esc(pid) + '" aria-pressed="' + on + '" aria-label="' + esc(lab) + '">' + (on ? SVG_MET : SVG_MEET) + '</button>';
  }

  // ---------- links per person (rule documented in tools/build_conf.py) ----------
  function searchName(n) { return String(n).replace(/\s*\([^)]*\)/g, '').replace(/\s*'[^']*'/g, '').replace(/\s+/g, ' ').trim(); }
  function out(url, text) { return '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(text) + SVG_OUT + '</a>'; }
  function personLinks(p) {
    var n = searchName(p.name), aff = p.aff ? ' ' + p.aff : '';
    return '<div class="links">' + out(C.li + encodeURIComponent(n + aff), 'LinkedIn') + out(C.sch + encodeURIComponent('"' + n + '"' + aff), 'Scholar') + '</div>';
  }

  // ---------- copy (clipboard API needs a secure context; content:// files often aren't) ----------
  function copy(t, what) {
    function fallback() {

  D.taxi.forEach(function (c) { CARDS[c.id] = c; });
  function taxiCard(c, key) {
    return '<button type="button" class="tcard' + (key ? ' key' : '') + '" data-go="card/' + esc(c.id) + '"><span class="label">' + esc(key ? 'Show the driver' : c.place) + '</span>' +
      '<span class="zh" lang="zh-Hans">' + esc(c.zh) + '</span>' + (c.addr ? '<span class="zh" lang="zh-Hans">' + esc(c.addr) + '</span>' : '') +
      '<span class="en">' + esc(key ? c.place.replace(/^Conference venue: /, '') : '') + (key && c.phone ? ' · <span class="nowrap">' + esc(c.phone) + '</span>' : '') + (key ? '' : c.notes.replace(/<(?!\/?span\b)[^>]+>/g, '')) + '</span></button>';
  }
  OVER.card = function (id) {
    var c = CARDS[id];
    if (!c) return '';
    return full('<div class="f-ask" lang="zh-Hans">' + esc(c.ask[0]) + '<small lang="en">' + esc(c.ask[1]) + '</small></div><div class="f-z' + (c.zh.length > 7 ? ' long' : '') + '" lang="zh-Hans">' + esc(c.zh) + '</div>' +
      (c.addr ? '<div class="f-a" lang="zh-Hans">' + esc(c.addr) + '</div>' : '') +
      (c.phone ? '<div class="f-p"><a href="tel:' + esc(c.phone.replace(/[^\d+]/g, '')) + '">' + esc(c.phone) + '</a></div>' : '') +
      '<div class="f-e">' + esc(c.place) + '</div><div class="f-n">' + c.notes + '</div>' +
      '<div class="btns">' + c.amap.map(function (a) { return '<a class="btn" href="' + esc(a.u) + '" target="_blank" rel="noopener">Open in Amap' + SVG_OUT + '</a>'; }).join('') + '</div>', 'Show the driver');
  };
  // Info, by urgency: the taxi cards first (arriving), then getting there, practical, the days, contacts, notes
  function renderInfo() {
    var iso = today(), secs = [['taxi', 'Taxi cards'], ['getting', 'Getting there'], ['practical', 'Practical'], ['glance', 'Days'], ['contacts', 'Contacts'], ['send', 'Send my notes']];
    var h = '<header class="mast bar"><h1>Practical info</h1></header>' +
      '<nav class="jump" aria-label="Sections">' + secs.map(function (s) { return '<button type="button" data-jump="' + s[0] + '">' + esc(s[1]) + '</button>'; }).join('') + '</nav>';
    h += sechead('', 'Taxi cards', 'taxi') +
      D.taxi.map(function (c, i) { return taxiCard(c, i === 0); }).join('');
    h += sechead('', 'Getting there', 'getting') + '<div class="prose">' + D.getting.intro + '</div>' +
      D.getting.subs.map(function (s) { return '<h3 class="h3">' + esc(s[0]) + '</h3><div class="prose">' + s[1] + '</div>'; }).join('');
    h += sechead('', 'Practical', 'practical') + '<ul class="sos"><li><a href="tel:110"><span class="num">110</span><span class="what">Police</span></a></li>' +
      '<li><a href="tel:120"><span class="num">120</span><span class="what">Ambulance</span></a></li><li><a href="tel:119"><span class="num">119</span><span class="what">Fire</span></a></li></ul>' +
      '<dl class="facts">' + D.practical.map(function (r) { return '<dt>' + esc(r[0]) + '</dt><dd>' + r[1] + '</dd>'; }).join('') + '</dl>';
    h += sechead('', 'The days at a glance', 'glance') + '<div class="prose">' + D.glance.intro + '</div>' + glanceHtml(iso) + '<div class="prose">' + D.glance.after + '</div>' +
      '<div class="btns"><a class="btn" href="#phrases/finder">Rooms and floors</a></div>';
    h += sechead('', 'Organiser contacts', 'contacts') + '<ul class="contacts">' + D.contacts.map(function (c) {
      return '<li><span class="label">' + esc(c[0].replace(' — ', ' · ')) + '</span><a href="mailto:' + esc(c[1]) + '">' + esc(c[1]) + '</a></li>';
    }).join('') + '</ul>';
    h += sechead('', 'Send my notes', 'send') + exportHtml();
    view.innerHTML = h;
  }

  // ---------- overlays: sheets (talk, person) and full-screen show-this cards ----------
  function sheet(kicker, body) {
    return '<div class="sheet" id="ov" role="dialog" aria-modal="true" aria-label="' + esc(kicker) + '"><div class="sheet-bar"><span class="kicker">' + esc(kicker) + '</span>' +
      '<button type="button" class="x" data-close aria-label="Close">' + SVG_X + '</button></div><div class="sheet-body">' + body + '</div></div>';
  }
  function full(body, lab) {
    return '<div class="full" id="ov" role="dialog" aria-modal="true" aria-label="' + esc(lab || 'Show this') + '"><button type="button" class="x" data-close aria-label="Close">' + SVG_X + '</button>' +
      '<div class="f-card">' + body + '</div><p class="f-awake" hidden>Screen stays on while this is open.</p></div>';
  }

  // ---------- router ----------
  var RENDER = { now: renderNow, prog: renderProg, people: renderPeople, phrases: renderPhrases, info: renderInfo };
  var base = null, baseArg = '', dirty = false;
  function parseHash(h) {
    h = String(h || '').replace(/^#/, '');
    var i = h.indexOf('/'), arg = i < 0 ? '' : h.slice(i + 1);
    try { arg = decodeURIComponent(arg); } catch (e) { arg = ''; }
    return { k: i < 0 ? h : h.slice(0, i), arg: arg };
  }
  function lastTab() { try { return sessionStorage.getItem(KEY + 'tab') || 'now'; } catch (e) { return 'now'; } }
  function paint(k, arg, keepScroll) {
    var y = window.scrollY;
    base = k; baseArg = arg;
    try { sessionStorage.setItem(KEY + 'tab', k); } catch (e) { /* optional */ }
    RENDER[k](arg, keepScroll);
    each('[data-tab]', function (b) { if (b.getAttribute('data-tab') === k) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
    // jumps from a route are instant (smooth scrolling is only for the in-page jump chips)
    if (keepScroll) window.scrollTo({ top: y, behavior: 'instant' });
    else if (arg && document.getElementById(arg)) document.getElementById(arg).scrollIntoView({ block: 'start', behavior: 'instant' });
    else window.scrollTo({ top: 0, behavior: 'instant' });
  }
  function closeOverlay() {
    var ov = document.getElementById('ov');
    if (!ov) return;
    dropNew();
    ov.parentNode.removeChild(ov);
    document.body.classList.remove('locked');
    letSleep();
    if (dirty && base) { dirty = false; rerender(); }
  }
  function route() {
    var r = parseHash(location.hash || '#now');
    closeOverlay();
    if (OVER[r.k]) {
      if (!base) paint(RENDER[lastTab()] ? lastTab() : 'now', '');
      var html = OVER[r.k](r.arg);
      if (!html) { location.replace('#' + base); return; }
      document.body.insertAdjacentHTML('beforeend', html);
      var ov = document.getElementById('ov');
      document.body.classList.add('locked');
      if (ov.classList.contains('full')) keepAwake();
      var x = ov.querySelector('[data-autofocus]') || ov.querySelector('[data-close]'); if (x) x.focus({ preventScroll: true });
      return;
    }
    if (!RENDER[r.k]) r = { k: 'now', arg: '' };
    if (r.k !== base || r.arg !== baseArg || !view.firstChild) paint(r.k, r.arg);
  }
  // entries the app pushes are marked, so closing a sheet steps back only within the app
  function go(h) { location.hash = h; try { history.replaceState({ dc: 1 }, '', location.href); } catch (e) { /* ignore */ } }
  function closeTop() { if (history.state && history.state.dc) history.back(); else location.replace('#' + (base || 'now')); }
  // redraw the current tab in place (after a star or a to-meet toggle): same scroll, same folds open
  function rerender() {
    var open = [], y = window.scrollY, a = document.activeElement, key = a && a.getAttribute && a.getAttribute('data-note'), s0 = key ? a.selectionStart : 0, s1 = key ? a.selectionEnd : 0;
    each('details[open][id]', function (d) { open.push(d.id); }, view);
    paint(base || 'now', '', true);
    open.forEach(function (id) { var d = document.getElementById(id); if (d) d.open = true; });
    if (open.length) window.scrollTo({ top: y, behavior: 'instant' });
    var ta = key && view.querySelector('textarea[data-note="' + key + '"]');
    if (ta) { ta.focus({ preventScroll: true }); try { ta.setSelectionRange(s0, s1); } catch (e) { /* ignore */ } }
  }

  // ---------- events ----------
  document.addEventListener('click', function (e) {
    // opening a note fold puts the cursor in the box: one tap to start typing during a talk
    var sm = e.target.closest('.nfold > summary');
    if (sm && !sm.parentNode.open) { var ta = sm.parentNode.querySelector('textarea'); setTimeout(function () { if (ta && sm.parentNode.open) ta.focus(); }, 0); return; }
    var t = e.target.closest('button, a');
    if (!t) return;
    if (t.hasAttribute('data-tab')) { var k = t.getAttribute('data-tab'); if (base === k && !document.getElementById('ov')) { paint(k, ''); } else go(k); return; }
    if (t.hasAttribute('data-close')) { closeTop(); return; }
    if (t.classList.contains('skip')) { e.preventDefault(); view.focus(); return; }
    var href = t.getAttribute('href');
    if (href && href.charAt(0) === '#' && href.length > 1) { e.preventDefault(); go(href.slice(1)); return; }
    if (t.hasAttribute('data-star')) {
      var id = t.getAttribute('data-star'), on = !starred(id);
      if (!sset('s:' + id, on ? 1 : 0)) return; // storage blocked: the toast says so, the star stays as it was
      dirty = true;
      each('[data-star="' + id + '"]', function (b) {
        b.setAttribute('aria-pressed', on);
        if (b.classList.contains('star-btn')) b.querySelector('span').textContent = on ? 'Starred' : 'Star';
        else b.setAttribute('aria-label', (on ? 'Starred: ' : 'Star: ') + T[id].title);
      });
      toast(on ? 'Starred' : 'Star removed');
      if (!document.getElementById('ov')) rerender();
      return;
    }
    if (t.hasAttribute('data-meet')) {
      var pid = t.getAttribute('data-meet'), m = !meeting(pid);
      if (!sset('m:' + pid, m ? 1 : 0)) return;
      dirty = true;
      each('[data-meet="' + pid + '"]', function (b) {
        var tmp = document.createElement('div');
        tmp.innerHTML = meetBtn(pid, b.classList.contains('btn'));
        b.parentNode.replaceChild(tmp.firstChild, b);
      });
      var f = document.querySelector('[data-meet="' + pid + '"]'); if (f) f.focus({ preventScroll: true });
      toast(m ? 'Added to your to-meet list' : 'Removed from your to-meet list');
      if (!document.getElementById('ov')) rerender();
      return;
    }
    if (t.hasAttribute('data-jump')) { var to = document.getElementById(t.getAttribute('data-jump')); if (to) to.scrollIntoView({ behavior: RM ? 'auto' : 'smooth', block: 'start' }); return; }
    if (t.hasAttribute('data-copy')) { copy(t.getAttribute('data-copy'), t.getAttribute('data-what') || ''); return; }
    for (var i = 0; i < CLICK.length; i++) if (CLICK[i](t, e)) return;
  });
  var lastType = 0; // real time of the last keystroke: Now waits while someone is typing
  document.addEventListener('input', function (e) {
    var t = e.target;
    lastType = Date.now();
    if (t.hasAttribute && t.hasAttribute('data-note')) {
      var kept = sset(t.getAttribute('data-note'), t.value); dirty = true;
      var s = t.parentNode.querySelector('.saved'), who = t.getAttribute('data-note').slice(3); // a person still being added has no record yet
      if (s) s.textContent = !kept ? 'Not saved: this phone blocks storage' : !t.value ? '' : who === NEWID && !PPL[who] ? 'Saved on this phone once it has a name' : 'Saved on this phone';
      // the closed fold shows what is saved: after a failed save that is the last saved note, not what was typed
      var fs = t.closest('.nfold') && t.closest('.nfold').querySelector('summary'); if (fs) fs.innerHTML = foldSum(kept ? t.value : note(t.getAttribute('data-note')));
      return;
    }
    for (var i = 0; i < INPUT.length; i++) if (INPUT[i](t, e)) return;
  });
  window.addEventListener('hashchange', route);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && document.getElementById('ov')) closeTop(); });

  // the clock: countdowns tick in place; Now redraws when what is on changes (never while typing)
  function tick() {
    each('[data-ms]', function (el) { el.textContent = until(+el.getAttribute('data-ms')); });
    each('[data-clock]', function (el) { el.textContent = bj(now()).hm; });
    TICK.forEach(function (f) { f(); });
  }
  setInterval(tick, 15000);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    // back from the lock screen: a note box left with focus must not freeze Now on a talk that has ended
    var a = document.activeElement; if (a && a.classList && a.classList.contains('note')) a.blur();
    tick();
    var ov = document.getElementById('ov'); if (ov && ov.classList.contains('full')) keepAwake();
  });

  document.getElementById('ver').textContent = 'This copy: updated ' + C.version;
  if (TEST) { var tb = document.createElement('div'); tb.className = 'testbar'; tb.textContent = 'Test time: ' + TEST + ' Beijing'; document.querySelector('.top').after(tb); }
  route();
})();
</script>
</body>
</html>
